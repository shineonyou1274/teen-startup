<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfeeff">
<meta name="color-scheme" content="light only">
<meta name="description" content="치킨집 사장님이 되어 열두 달 동안 가게를 키우는 창업 체험 게임.">
<title>틴 스타트업 · 치킨집</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">

<body>
<div id="app">
  <section id="stage">
    <canvas id="gl" aria-label="내 치킨집을 위에서 내려다본 3D 장면"></canvas>
    <div id="hud" hidden>
      <span id="monthChip"></span>
      <div id="stats"></div>
    </div>
    <button id="zoomBtn" aria-label="가게 크게 보기">⤢</button>
    <button id="soundBtn" aria-label="소리 끄기">♪</button>
  </section>
  <main id="panel" aria-live="polite"></main>
</div>
<script type="module" src="/src/main.js"></script>

</html>
