갔어. 하지만 언제 문제가 될지 몰라."}}},{label:"근무 시간을 15시간 밑으로 쪼갠다",fx:{team:-8,trust:-3},text:"법은 어기지 않았어. 하지만 알바생들 수입이 줄었고, 사람이 자주 바뀌어 주문 실수가 늘었어."}]},{title:"닭고기 값이 30% 뛰었다",idea:!0,text:'아침에 거래처에서 문자가 왔어. "조류 독감으로 닭값 인상합니다." 한 마리당 재료비가 1,800원 올라.',concept:"원가와 가격 — 재료비가 오르면 누군가는 그 부담을 져야 해. 손님일까, 사장일까, 품질일까.",choices:[{label:"치킨값을 2,000원 올린다",fx:{unitCost:1800,price:2e3,trust:-6},text:'남는 돈은 지켰어. "여기도 올랐네" 하며 돌아서는 손님이 눈에 띄어.'},{label:"남는 돈을 줄이고 가격을 그대로 둔다",fx:{unitCost:1800,trust:8},text:'"다 오르는데 여긴 그대로네!" 단골이 늘었어. 대신 한 마리 팔 때 남는 돈이 확 줄었어.'},{label:"값싼 냉동 수입 닭으로 바꾼다",fx:{trust:-4,flag:"frozen"},text:'재료비는 그대로야. 그런데 "맛이 변했다"는 말이 들리기 시작했어.'}]},{title:"별점 1점 리뷰",text:'"치킨이 다 식어서 왔어요. 다시는 안 시켜요." 앱에 별점 1점이 달렸어. 사실 그날은 배달 기사가 길을 헤맨 날이야.',concept:"평판 — 눈에 보이지 않지만 가게의 큰 재산이야. 쌓는 데는 오래 걸리고 잃는 건 한순간이야.",choices:[{label:"사과 댓글을 달고 새로 튀겨 보낸다",fx:{cash:-10,trust:6},text:'손님이 리뷰를 고쳤어. "대처가 좋아서 별 다섯 개로 바꿉니다." 그 댓글을 본 다른 손님도 주문했어.'},{label:'"배달 기사님 잘못입니다"라고 답한다',fx:{trust:-8},text:'틀린 말은 아니야. 하지만 댓글을 본 사람들은 "손님이랑 싸우는 가게"로 기억했어.'},{label:"별 다섯 개 리뷰를 쓰면 콜라를 주는 행사를 연다",fx:{cash:-30,trust:2,temp:1.1},text:"별점 평균이 금방 올랐어.",risk:{p:.4,bad:{fx:{trust:-10},text:'그런데 누군가 "리뷰를 돈 주고 산다"는 글을 동네 커뮤니티에 올렸어.'},good:{text:"새 손님들이 높은 별점을 보고 주문했어."}}}]},{title:"길 건너에 대형 치킨집이 생겼다",idea:!0,text:"유명 프랜차이즈가 길 건너에 문을 열고 한 달 동안 반값 행사를 해. 우리 가게 손님이 눈에 띄게 줄었어.",concept:'경쟁과 차별화 — 값으로 싸우면 덩치 큰 쪽이 유리해. 작은 가게는 "여기만의 이유"가 필요해.',choices:[{label:"우리도 한 달 동안 할인으로 맞선다",fx:{cash:-200,trust:2,demand:.95},text:"손님은 붙잡았어. 하지만 팔수록 손해라 통장에서 200만 원이 사라졌어."},{label:"우리 가게만의 새 메뉴를 만든다",fx:{cash:-120,trust:5,demand:1.05},text:'2주 동안 밤마다 연습한 "마늘 간장 치킨"이 나왔어. 이걸 먹으러 일부러 찾아오는 손님이 생겼어.'},{label:"단골에게 쿠폰 10장에 한 마리를 준다",fx:{unitCost:500,trust:7,demand:.97},text:"단골은 떠나지 않았어. 공짜 치킨만큼 한 마리당 드는 돈이 조금 늘었어."}]},{title:"동네 축제로 300만 원이 생겼다",text:"동네 축제 단체 주문이 몰려서 예상에 없던 300만 원이 들어왔어. 이 돈을 어디에 쓸까?",concept:"기회비용 — 하나를 고르면 다른 것은 포기해야 해. 포기한 것 가운데 가장 아까운 것이 그 선택의 값이야.",choices:[{label:"고생한 알바생들에게 보너스를 주고 시급을 올린다",fx:{cash:100,wage:10,team:20},text:"민지와 태오가 환하게 웃었어. 손님한테 건네는 인사 소리부터 달라졌어."},{label:"지역 아동 센터에 치킨 50마리를 보낸다",fx:{cash:150,impact:25,trust:8},text:'아이들이 삐뚤빼뚤한 감사 편지를 보내왔어. 동네 소식지에 "착한 가게"로 실렸어.'},{label:"가게를 키울 때를 대비해 모아 둔다",fx:{cash:300},text:"통장이 든든해졌어. 가게를 넓힐 날이 한 걸음 가까워졌어."}]},{title:"포장 쓰레기 민원",idea:!0,text:'"치킨 상자랑 비닐이 골목에 너무 많이 나와요." 주민 센터로 민원이 들어갔대. 우리 가게 상자도 섞여 있어.',concept:"외부 효과 — 내 장사가 남에게 주는 피해나 도움은 가격표에 안 적혀 있어. 그 비용은 누가 내야 할까?",choices:[{label:"종이로 된 친환경 포장재로 바꾼다",fx:{unitCost:400,impact:15,trust:3,flag:"eco"},text:'한 마리당 400원이 더 들어. "여기는 비닐을 안 써서 좋다"는 리뷰가 달렸어.'},{label:"지금 포장을 그대로 쓴다",fx:{impact:-5},text:"돈은 들지 않았어. 골목 쓰레기는 그대로야."},{label:"그릇을 가져오면 500원 깎아 주는 캠페인을 연다",fx:{cash:-80,unitCost:-100,impact:20,trust:4,flag:"eco"},text:"안내판과 그릇 세척대에 80만 원이 들었어. 냄비를 들고 오는 손님이 동네 명물이 됐어."}]},{title:"유통 기한이 하루 지난 소스",text:"창고를 정리하다가 유통 기한이 어제까지인 양념 소스 40만 원어치를 발견했어. 냄새도 색도 멀쩡해 보여.",concept:"위험과 신뢰 — 아낀 돈은 작고 확실하지만, 사고가 나면 잃는 것은 크고 오래가.",choices:[{label:"아깝지만 전부 버린다",fx:{cash:-40,trust:2},text:"40만 원이 쓰레기통으로 갔어. 그래도 오늘 밤은 마음 편히 잘 수 있어."},{label:"멀쩡해 보이니 그냥 쓴다",fx:{},text:"소스를 그대로 썼어.",risk:{p:.5,bad:{fx:{cash:-200,trust:-20},text:"사흘 뒤, 배탈이 났다는 손님의 신고로 위생 점검이 나왔어. 과태료를 내고 며칠 문을 닫았어."},good:{text:"이번에는 아무 일도 없었어. 운이 좋았던 걸까?"}}},{label:"버리고, 재고 관리표를 만든다",fx:{cash:-40,team:-3,etc:-5,trust:2},text:"날마다 적는 일이 늘어 알바생들이 투덜댔어. 대신 버리는 재료가 줄어 매달 5만 원을 아끼게 됐어."}]},{title:"단체 주문 30마리가 빠졌다",idea:!0,text:"알바생 태오가 전화 주문을 적어 두지 않았어. 회사 회식용 30마리가 통째로 빠졌고, 손님은 크게 화가 났어.",concept:"책임 — 직원의 실수로 생긴 손해를 월급에서 마음대로 빼는 것은 법으로 막혀 있어. 가게의 실수는 가게가 책임져.",choices:[{label:"사장인 내가 사과하고 환불한다",fx:{cash:-60,trust:6,team:8},text:"손님 회사까지 찾아가 고개를 숙였어. 태오는 그날부터 주문을 두 번씩 확인해."},{label:"손해 본 돈을 태오 월급에서 뺀다",fx:{team:-18},text:"통장은 지켰어. 가게 안이 조용해졌어.",risk:{p:.5,bad:{fx:{team:-10,temp:.85},text:"태오가 다음 날 그만뒀어. 새 사람을 구할 때까지 주문을 다 받지 못했어."},good:{text:"태오는 말없이 일했어. 눈을 마주치지 않아."}}},{label:"환불하고, 하루 문을 닫아 주문 확인 방법을 함께 만든다",fx:{cash:-60,temp:.93,team:10,trust:8},text:'하루 매출을 포기했어. 벽에 붙인 "주문 세 번 확인" 표는 알바생들이 직접 그렸어.'}]},{title:"내년에는 어떤 가게가 될까",text:"개업 1년이 코앞이야. 마지막 달, 내년을 위해 한 가지를 약속하기로 했어.",concept:"지속 가능성 — 올해만 잘되는 가게와 오래가는 가게는 무엇이 다를까?",choices:[{label:"아동 센터에 매달 치킨을 보내기로 약속한다",fx:{etc:30,impact:25,trust:6},text:"매달 30만 원어치야. 센터 벽에 우리 가게 이름이 적힌 감사패가 걸렸어."},{label:"오래 일한 알바생을 정식 매니저로 올린다",fx:{wage:15,team:18,trust:3},text:"인건비가 늘었어. 이제 내가 자리를 비워도 가게가 똑같이 돌아가."},{label:"연말 대목 광고에 100만 원을 쓴다",fx:{cash:-100,temp:1.3},text:"동네 곳곳에 현수막이 걸렸어. 연말 주문 전화가 줄을 이었어."}]}],Zl={4:{title:'"사장님, 2주만 쉬어도 될까요?"',text:"알바생 민지가 시험 기간이라 2주 동안 쉬고 싶대. 하필 가게가 바빠지기 시작한 때야.",concept:"사람도 자원 — 같이 일하는 사람의 사정을 살피는 일은 비용이면서 투자야.",choices:[{label:"쉬게 하고, 그동안 내가 두 사람 몫을 한다",sk:"T",fx:{team:10,temp:.93},text:"민지는 고맙다며 시험을 보러 갔어. 2주 동안 나는 녹초가 됐고, 놓친 주문도 있었어."},{label:"2주 동안 일할 단기 알바를 구한다",sk:"P",fx:{cash:-50,team:6},text:"구인 광고와 교육에 50만 원이 들었어. 가게는 평소처럼 돌아갔어."},{label:'"지금은 바빠서 안 돼"라고 한다',fx:{team:-12},text:"민지는 알겠다고 했어.",risk:{p:.5,bad:{fx:{team:-8,temp:.9},text:"그리고 사흘 뒤, 그만두겠다는 문자가 왔어. 새 사람을 구할 때까지 일손이 모자랐어."},good:{text:"시험 전날에도 나와서 일했지만, 표정이 어두웠어."}}}]},5:{title:"식용유 값이 두 배가 됐다",idea:!0,text:"튀김 기름값이 두 배로 뛰었어. 기름을 며칠 더 쓰면 돈을 아낄 수 있지만, 오래 쓴 기름은 맛과 색이 달라져.",concept:"품질과 비용 — 아낀 돈은 장부에 바로 보이지만, 떨어진 품질은 손님이 먼저 알아채.",choices:[{label:"돈이 더 들어도 기름을 예전처럼 자주 간다",fx:{unitCost:700,trust:4},text:'한 마리당 700원이 더 들어. "여긴 기름이 깨끗해"라는 리뷰가 달렸어.'},{label:"기름을 며칠 더 쓴다",fx:{trust:-6},text:"재료비는 그대로야. 그런데 치킨 색이 거뭇해졌다는 말이 나왔어."},{label:"기름을 덜 쓰는 오븐 구이 메뉴를 더한다",sk:"I",fx:{cash:-150,unitCost:200,demand:1.04,trust:3},text:"오븐을 들이는 데 150만 원이 들었어. 담백한 맛을 찾는 새 손님이 생겼어."}]},6:{title:"인플루언서의 협찬 요청",text:'동네 맛집 계정을 운영하는 사람이 연락했어. "치킨을 보내 주시면 좋게 써 드릴게요. 광고라고는 안 적을게요."',concept:"광고와 정직 — 돈이나 물건을 받고 쓴 글은 광고라고 밝혀야 해. 숨기면 소비자를 속이는 일이 돼.",choices:[{label:'치킨을 보내고, "협찬"이라고 꼭 적어 달라고 한다',sk:"C",fx:{cash:-20,temp:1.15,trust:3},text:'"협찬받았지만 진짜 맛있다"는 글이 올라왔어. 처음 보는 손님들이 찾아왔어.'},{label:"광고 표시 없이 칭찬 글만 올려 달라고 한다",fx:{temp:1.2},text:"진짜 후기처럼 보이는 글이 올라왔고, 주문이 확 늘었어.",risk:{p:.5,bad:{fx:{trust:-12},text:'그런데 누군가 "뒷광고"라고 알아채 퍼뜨렸어. 가게 이름이 안 좋은 일로 알려졌어.'},good:{text:"아직은 아무도 눈치채지 못했어."}}},{label:"정중히 거절하고 맛으로만 승부한다",fx:{trust:2},text:"주문이 갑자기 늘지는 않았어. 대신 찜찜한 일도 없어."}]},7:{title:"옆 가게의 동업 제안",idea:!0,text:'옆 분식집 사장님이 찾아왔어. "큰 가게들 때문에 다들 힘든데, 우리 치킨이랑 떡볶이를 묶어서 같이 팔아 볼래요?"',concept:"경쟁과 협력 — 이웃 가게는 손님을 나눠 갖는 경쟁자이면서, 손님을 함께 불러오는 동료가 될 수도 있어.",choices:[{label:'함께 "치킨 떡볶이 세트"를 만든다',sk:"TI",fx:{cash:-40,demand:1.07,trust:3,impact:5},text:"메뉴판과 포장을 같이 만들었어. 두 가게 손님이 서로 오가기 시작했어."},{label:"우리 가게에서 떡볶이도 직접 판다",sk:"C",fx:{cash:-150,demand:1.08,team:-5},text:"주문은 늘었어. 주방 일이 두 배가 되어 알바생들이 힘들어하고, 옆 가게와는 서먹해졌어."},{label:"치킨 하나에만 집중한다",fx:{trust:2},text:"메뉴는 그대로야. 치킨 맛만큼은 흔들리지 않았어."}]},8:{title:"단골 회사의 정기 주문 제안",text:'근처 회사 총무팀에서 연락이 왔어. "매달 100마리씩 정기로 시킬게요. 대신 값을 10% 깎아 주세요."',concept:"협상 — 값을 깎아 주면 한 마리당 남는 돈은 줄지만, 꾸준히 들어오는 매출은 가게를 안정시켜.",choices:[{label:"10% 할인을 받아들인다",sk:"P",fx:{demand:1.08,price:-300,trust:3},text:"매달 100마리가 꼬박꼬박 나가. 평균 판매가는 조금 내려갔어."},{label:"할인 대신 음료를 얹어 주겠다고 다시 제안한다",sk:"C",fx:{},text:"값은 지키고 덤을 주겠다고 했어.",risk:{p:.45,fair:!0,bad:{fx:{},text:'총무팀은 "그럼 다른 곳에 알아볼게요" 하고 전화를 끊었어.'},good:{fx:{demand:1.08,unitCost:100},text:'"그것도 좋네요!" 값을 지키면서 정기 주문을 따냈어.'}}},{label:"정가가 아니면 팔지 않겠다고 거절한다",fx:{},text:"값은 지켰어. 정기 주문은 다른 가게로 갔어."}]},9:{title:"밤늦은 소음과 냄새 민원",idea:!0,text:'위층 주민이 찾아왔어. "밤 11시 넘어서까지 오토바이 소리와 튀김 냄새 때문에 잠을 못 자요."',concept:"외부 효과 — 내 장사가 이웃에게 주는 불편은 가격표에 안 적혀 있어. 그 비용은 누가 내야 할까?",choices:[{label:"문 닫는 시간을 밤 10시로 당긴다",fx:{demand:.94,impact:12,team:5},text:"늦은 밤 주문을 포기했어. 이웃도, 일찍 퇴근하게 된 알바생들도 고마워했어."},{label:"환기 필터를 새로 달고, 밤에는 조용히 배달한다",sk:"P",fx:{cash:-120,impact:10,trust:3},text:"120만 원이 들었어. 냄새가 줄었고, 주민이 단골이 됐어."},{label:'"장사하려면 어쩔 수 없어요"라고 답한다',fx:{impact:-8,trust:-3},text:"돈은 들지 않았어. 동네 커뮤니티에 우리 가게 이야기가 올라왔어."}]},10:{title:"보험, 들까 말까",text:'보험 설계사가 찾아왔어. "불이 나거나 손님이 탈이 나면 수천만 원이 들 수 있어요. 한 달에 8만 원이면 대비됩니다."',concept:"보험 — 일어날지 모르는 큰 손해에 대비해 작은 돈을 꾸준히 내는 일이야. 아무 일 없으면 그 돈은 사라져.",choices:[{label:"보험에 든다",sk:"P",fx:{etc:8},text:"매달 8만 원이 나가. 불이 나도 가게가 통째로 사라질 걱정은 없어."},{label:"아직은 괜찮을 것 같아 들지 않는다",fx:{},text:"보험료를 아꼈어.",risk:{p:.35,b
