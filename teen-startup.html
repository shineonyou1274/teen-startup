는 친구들한테 "우리 사장님은 다르다"고 자랑했대.'},{label:'"다들 안 줘" 하고 넘어간다',fx:{team:-15},text:"민지는 더 묻지 않았어. 그날부터 가게 분위기가 조금 식었어.",risk:{p:.6,bad:{fx:{cash:-150,trust:-5},text:"며칠 뒤 노동청에서 연락이 왔어. 밀린 수당에 합의금까지 물어 줬고, 동네에 소문도 났어."},good:{text:"이번에는 조용히 넘어갔어. 하지만 언제 문제가 될지 몰라."}}},{label:"근무 시간을 15시간 밑으로 쪼갠다",fx:{team:-8,trust:-3},text:"법은 어기지 않았어. 하지만 알바생들 수입이 줄었고, 사람이 자주 바뀌어 주문 실수가 늘었어."}]},{title:"닭고기 값이 30% 뛰었다",idea:!0,text:'아침에 거래처에서 문자가 왔어. "조류 독감으로 닭값 인상합니다." 한 마리당 재료비가 1,800원 올라.',concept:"원가와 가격 — 재료비가 오르면 누군가는 그 부담을 져야 해. 손님일까, 사장일까, 품질일까.",choices:[{label:"치킨값을 2,000원 올린다",fx:{unitCost:1800,price:2e3,trust:-6},text:'남는 돈은 지켰어. "여기도 올랐네" 하며 돌아서는 손님이 눈에 띄어.'},{label:"남는 돈을 줄이고 가격을 그대로 둔다",fx:{unitCost:1800,trust:8},text:'"다 오르는데 여긴 그대로네!" 단골이 늘었어. 대신 한 마리 팔 때 남는 돈이 확 줄었어.'},{label:"값싼 냉동 수입 닭으로 바꾼다",fx:{trust:-4,flag:"frozen"},text:'재료비는 그대로야. 그런데 "맛이 변했다"는 말이 들리기 시작했어.'}]},{title:"별점 1점 리뷰",text:'"치킨이 다 식어서 왔어요. 다시는 안 시켜요." 앱에 별점 1점이 달렸어. 사실 그날은 배달 기사가 길을 헤맨 날이야.',concept:"평판 — 눈에 보이지 않지만 가게의 큰 재산이야. 쌓는 데는 오래 걸리고 잃는 건 한순간이야.",choices:[{label:"사과 댓글을 달고 새로 튀겨 보낸다",fx:{cash:-10,trust:6},text:'손님이 리뷰를 고쳤어. "대처가 좋아서 별 다섯 개로 바꿉니다." 그 댓글을 본 다른 손님도 주문했어.'},{label:'"배달 기사님 잘못입니다"라고 답한다',fx:{trust:-8},text:'틀린 말은 아니야. 하지만 댓글을 본 사람들은 "손님이랑 싸우는 가게"로 기억했어.'},{label:"별 다섯 개 리뷰를 쓰면 콜라를 주는 행사를 연다",fx:{cash:-30,trust:2,temp:1.1},text:"별점 평균이 금방 올랐어.",risk:{p:.4,bad:{fx:{trust:-10},text:'그런데 누군가 "리뷰를 돈 주고 산다"는 글을 동네 커뮤니티에 올렸어.'},good:{text:"새 손님들이 높은 별점을 보고 주문했어."}}}]},{title:"길 건너에 대형 치킨집이 생겼다",idea:!0,text:"유명 프랜차이즈가 길 건너에 문을 열고 한 달 동안 반값 행사를 해. 우리 가게 손님이 눈에 띄게 줄었어.",concept:'경쟁과 차별화 — 값으로 싸우면 덩치 큰 쪽이 유리해. 작은 가게는 "여기만의 이유"가 필요해.',choices:[{label:"우리도 한 달 동안 할인으로 맞선다",fx:{cash:-200,trust:2,demand:.95},text:"손님은 붙잡았어. 하지만 팔수록 손해라 통장에서 200만 원이 사라졌어."},{label:"우리 가게만의 새 메뉴를 만든다",fx:{cash:-120,trust:5,demand:1.05},text:'2주 동안 밤마다 연습한 "마늘 간장 치킨"이 나왔어. 이걸 먹으러 일부러 찾아오는 손님이 생겼어.'},{label:"단골에게 쿠폰 10장에 한 마리를 준다",fx:{unitCost:500,trust:7,demand:.97},text:"단골은 떠나지 않았어. 공짜 치킨만큼 한 마리당 드는 돈이 조금 늘었어."}]},{title:"동네 축제로 300만 원이 생겼다",text:"동네 축제 단체 주문이 몰려서 예상에 없던 300만 원이 들어왔어. 이 돈을 어디에 쓸까?",concept:"기회비용 — 하나를 고르면 다른 것은 포기해야 해. 포기한 것 가운데 가장 아까운 것이 그 선택의 값이야.",choices:[{label:"고생한 알바생들에게 보너스를 주고 시급을 올린다",fx:{cash:100,wage:10,team:20},text:"민지와 태오가 환하게 웃었어. 손님한테 건네는 인사 소리부터 달라졌어."},{label:"지역 아동 센터에 치킨 50마리를 보낸다",fx:{cash:150,impact:25,trust:8},text:'아이들이 삐뚤빼뚤한 감사 편지를 보내왔어. 동네 소식지에 "착한 가게"로 실렸어.'},{label:"가게를 키울 때를 대비해 모아 둔다",fx:{cash:300},text:"통장이 든든해졌어. 가게를 넓힐 날이 한 걸음 가까워졌어."}]},{title:"포장 쓰레기 민원",idea:!0,text:'"치킨 상자랑 비닐이 골목에 너무 많이 나와요." 주민 센터로 민원이 들어갔대. 우리 가게 상자도 섞여 있어.',concept:"외부 효과 — 내 장사가 남에게 주는 피해나 도움은 가격표에 안 적혀 있어. 그 비용은 누가 내야 할까?",choices:[{label:"종이로 된 친환경 포장재로 바꾼다",fx:{unitCost:400,impact:15,trust:3,flag:"eco"},text:'한 마리당 400원이 더 들어. "여기는 비닐을 안 써서 좋다"는 리뷰가 달렸어.'},{label:"지금 포장을 그대로 쓴다",fx:{impact:-5},text:"돈은 들지 않았어. 골목 쓰레기는 그대로야."},{label:"그릇을 가져오면 500원 깎아 주는 캠페인을 연다",fx:{cash:-80,unitCost:-100,impact:20,trust:4,flag:"eco"},text:"안내판과 그릇 세척대에 80만 원이 들었어. 냄비를 들고 오는 손님이 동네 명물이 됐어."}]},{title:"유통 기한이 하루 지난 소스",text:"창고를 정리하다가 유통 기한이 어제까지인 양념 소스 40만 원어치를 발견했어. 냄새도 색도 멀쩡해 보여.",concept:"위험과 신뢰 — 아낀 돈은 작고 확실하지만, 사고가 나면 잃는 것은 크고 오래가.",choices:[{label:"아깝지만 전부 버린다",fx:{cash:-40,trust:2},text:"40만 원이 쓰레기통으로 갔어. 그래도 오늘 밤은 마음 편히 잘 수 있어."},{label:"멀쩡해 보이니 그냥 쓴다",fx:{},text:"소스를 그대로 썼어.",risk:{p:.5,bad:{fx:{cash:-200,trust:-20},text:"사흘 뒤, 배탈이 났다는 손님의 신고로 위생 점검이 나왔어. 과태료를 내고 며칠 문을 닫았어."},good:{text:"이번에는 아무 일도 없었어. 운이 좋았던 걸까?"}}},{label:"버리고, 재고 관리표를 만든다",fx:{cash:-40,team:-3,etc:-5,trust:2},text:"날마다 적는 일이 늘어 알바생들이 투덜댔어. 대신 버리는 재료가 줄어 매달 5만 원을 아끼게 됐어."}]},{title:"단체 주문 30마리가 빠졌다",idea:!0,text:"알바생 태오가 전화 주문을 적어 두지 않았어. 회사 회식용 30마리가 통째로 빠졌고, 손님은 크게 화가 났어.",concept:"책임 — 직원의 실수로 생긴 손해를 월급에서 마음대로 빼는 것은 법으로 막혀 있어. 가게의 실수는 가게가 책임져.",choices:[{label:"사장인 내가 사과하고 환불한다",fx:{cash:-60,trust:6,team:8},text:"손님 회사까지 찾아가 고개를 숙였어. 태오는 그날부터 주문을 두 번씩 확인해."},{label:"손해 본 돈을 태오 월급에서 뺀다",fx:{team:-18},text:"통장은 지켰어. 가게 안이 조용해졌어.",risk:{p:.5,bad:{fx:{team:-10,temp:.85},text:"태오가 다음 날 그만뒀어. 새 사람을 구할 때까지 주문을 다 받지 못했어."},good:{text:"태오는 말없이 일했어. 눈을 마주치지 않아."}}},{label:"환불하고, 하루 문을 닫아 주문 확인 방법을 함께 만든다",fx:{cash:-60,temp:.93,team:10,trust:8},text:'하루 매출을 포기했어. 벽에 붙인 "주문 세 번 확인" 표는 알바생들이 직접 그렸어.'}]},{title:"내년에는 어떤 가게가 될까",text:"개업 1년이 코앞이야. 마지막 달, 내년을 위해 한 가지를 약속하기로 했어.",concept:"지속 가능성 — 올해만 잘되는 가게와 오래가는 가게는 무엇이 다를까?",choices:[{label:"아동 센터에 매달 치킨을 보내기로 약속한다",fx:{etc:30,impact:25,trust:6},text:"매달 30만 원어치야. 센터 벽에 우리 가게 이름이 적힌 감사패가 걸렸어."},{label:"오래 일한 알바생을 정식 매니저로 올린다",fx:{wage:15,team:18,trust:3},text:"인건비가 늘었어. 이제 내가 자리를 비워도 가게가 똑같이 돌아가."},{label:"연말 대목 광고에 100만 원을 쓴다",fx:{cash:-100,temp:1.3},text:"동네 곳곳에 현수막이 걸렸어. 연말 주문 전화가 줄을 이었어."}]}],Rm={4:{title:'"사장님, 2주만 쉬어도 될까요?"',text:"알바생 민지가 시험 기간이라 2주 동안 쉬고 싶대. 하필 가게가 바빠지기 시작한 때야.",concept:"사람도 자원 — 같이 일하는 사람의 사정을 살피는 일은 비용이면서 투자야.",choices:[{label:"쉬게 하고, 그동안 내가 두 사람 몫을 한다",sk:"T",fx:{team:10,temp:.93},text:"민지는 고맙다며 시험을 보러 갔어. 2주 동안 나는 녹초가 됐고, 놓친 주문도 있었어."},{label:"2주 동안 일할 단기 알바를 구한다",sk:"P",fx:{cash:-50,team:6},text:"구인 광고와 교육에 50만 원이 들었어. 가게는 평소처럼 돌아갔어."},{label:'"지금은 바빠서 안 돼"라고 한다',fx:{team:-12},text:"민지는 알겠다고 했어.",risk:{p:.5,bad:{fx:{team:-8,temp:.9},text:"그리고 사흘 뒤, 그만두겠다는 문자가 왔어. 새 사람을 구할 때까지 일손이 모자랐어."},good:{text:"시험 전날에도 나와서 일했지만, 표정이 어두웠어."}}}]},5:{title:"식용유 값이 두 배가 됐다",idea:!0,text:"튀김 기름값이 두 배로 뛰었어. 기름을 며칠 더 쓰면 돈을 아낄 수 있지만, 오래 쓴 기름은 맛과 색이 달라져.",concept:"품질과 비용 — 아낀 돈은 장부에 바로 보이지만, 떨어진 품질은 손님이 먼저 알아채.",choices:[{label:"돈이 더 들어도 기름을 예전처럼 자주 간다",fx:{unitCost:700,trust:4},text:'한 마리당 700원이 더 들어. "여긴 기름이 깨끗해"라는 리뷰가 달렸어.'},{label:"기름을 며칠 더 쓴다",fx:{trust:-6},text:"재료비는 그대로야. 그런데 치킨 색이 거뭇해졌다는 말이 나왔어."},{label:"기름을 덜 쓰는 오븐 구이 메뉴를 더한다",sk:"I",fx:{cash:-150,unitCost:200,demand:1.04,trust:3},text:"오븐을 들이는 데 150만 원이 들었어. 담백한 맛을 찾는 새 손님이 생겼어."}]},6:{title:"인플루언서의 협찬 요청",text:'동네 맛집 계정을 운영하는 사람이 연락했어. "치킨을 보내 주시면 좋게 써 드릴게요. 광고라고는 안 적을게요."',concept:"광고와 정직 — 돈이나 물건을 받고 쓴 글은 광고라고 밝혀야 해. 숨기면 소비자를 속이는 일이 돼.",choices:[{label:'치킨을 보내고, "협찬"이라고 꼭 적어 달라고 한다',sk:"C",fx:{cash:-20,temp:1.15,trust:3},text:'"협찬받았지만 진짜 맛있다"는 글이 올라왔어. 처음 보는 손님들이 찾아왔어.'},{label:"광고 표시 없이 칭찬 글만 올려 달라고 한다",fx:{temp:1.2},text:"진짜 후기처럼 보이는 글이 올라왔고, 주문이 확 늘었어.",risk:{p:.5,bad:{fx:{trust:-12},text:'그런데 누군가 "뒷광고"라고 알아채 퍼뜨렸어. 가게 이름이 안 좋은 일로 알려졌어.'},good:{text:"아직은 아무도 눈치채지 못했어."}}},{label:"정중히 거절하고 맛으로만 승부한다",fx:{trust:2},text:"주문이 갑자기 늘지는 않았어. 대신 찜찜한 일도 없어."}]},7:{title:"옆 가게의 동업 제안",idea:!0,text:'옆 분식집 사장님이 찾아왔어. "큰 가게들 때문에 다들 힘든데, 우리 치킨이랑 떡볶이를 묶어서 같이 팔아 볼래요?"',concept:"경쟁과 협력 — 이웃 가게는 손님을 나눠 갖는 경쟁자이면서, 손님을 함께 불러오는 동료가 될 수도 있어.",choices:[{label:'함께 "치킨 떡볶이 세트"를 만든다',sk:"TI",fx:{cash:-40,demand:1.07,trust:3,impact:5},text:"메뉴판과 포장을 같이 만들었어. 두 가게 손님이 서로 오가기 시작했어."},{label:"우리 가게에서 떡볶이도 직접 판다",sk:"C",fx:{cash:-150,demand:1.08,team:-5},text:"주문은 늘었어. 주방 일이 두 배가 되어 알바생들이 힘들어하고, 옆 가게와는 서먹해졌어."},{label:"치킨 하나에만 집중한다",fx:{trust:2},text:"메뉴는 그대로야. 치킨 맛만큼은 흔들리지 않았어."}]},8:{title:"단골 회사의 정기 주문 제안",text:'근처 회사 총무팀에서 연락이 왔어. "매달 100마리씩 정기로 시킬게요. 대신 값을 10% 깎아 주세요."',concept:"협상 — 값을 깎아 주면 한 마리당 남는 돈은 줄지만, 꾸준히 들어오는 매출은 가게를 안정시켜.",choices:[{label:"10% 할인을 받아들인다",sk:"P",fx:{demand:1.08,price:-300,trust:3},text:"매달 100마리가 꼬박꼬박 나가. 평균 판매가는 조금 내려갔어."},{label:"할인 대신 음료를 얹어 주겠다고 다시 제안한다",sk:"C",fx:{},text:"값은 지키고 덤을 주겠다고 했어.",risk:{p:.45,fair:!0,bad:{fx:{},text:'총무팀은 "그럼 다른 곳에 알아볼게요" 하고 전화를 끊었어.'},good:{fx:{demand:1.08,unitCost:100},text:'"그것도 좋네요!" 값을 지키면서 정기 주문을 따냈어.'}}},{label:"정가가 아니면 팔지 않겠다고 거절한다",fx:{},text:"값은 지켰어. 정기 주문은 다른 가게로 갔어."}]},9:{title:"밤늦은 소음과 냄새 민원",idea:!0,text:'위층 주민이 찾아왔어. "밤 11시 넘어서까지 오토바이 소리와 튀김 냄새 때문에 잠을 못 자요."',concept:"외부 효과 — 내 장사가 이웃에게 주는 불편은 가격표에 안 적혀 있어. 그 비용은 누가 내야 할까?",choices:[{label:"문 닫는 시간을 밤 10시로 당긴다",fx:{demand:.94,impact:12,team:5},text:"늦은 밤 주문을 포기했어. 이웃도, 일찍 퇴근하게 된 알바생들도 고마워했어."},{label:"환기 필터를 새로 달고, 밤에는 조용히 배달한다",sk:"P",fx:{cash:-120,impact:10,trust:3},text:"120만 원이 들었어. 냄새가 줄었고, 주민이 단골이 됐어."},{label:'"장사하려면 어쩔 수 없어요"라고 답한다',fx:{impact:-8,trust:-3},text:"돈은 들지 않았어. 동네 커뮤니티에 우리 가게 이야기가 올라왔어."}]},10:{title:"보험, 들까 말까",text:'보험 설계사가 찾아왔어. "불이 나거나 손님이 탈이 나면 수천만 원이 들 수 있어요. 한 달에 8만 원이면 대비됩니다."',concept:"보험 — 일어날지 모르는 큰 손해에 대비해 작은 돈을 꾸준히 내는 일이야. 아무 일 없으면 그 돈은 사라져.",choices:[{label:"보험에 든다",sk:"P",fx:{etc:8},text:"매달 8만 원이 나가. 불이 나도 가게가 통째로 사라질 걱정은 없어."},{label:"아직은 괜찮을 것 같아 들지 않는다",fx:{},text:"보험료를 아꼈어.",risk:{p:.35,bad:{fx:{cash:-250,temp:.85},text:"그달 말, 튀김기 옆에서 작은 불이 났어. 수리비를 전부 내 돈으로 물고 며칠 문을 닫았어."},good:{text:"이번 달에는 아무 일도 없었어."}}},{label:"소화기를 사고 안전 점검표를 만든다",sk:"P",fx:{cash:-20,team:3},text:"20만 원으로 소화기 두 대를 놓고, 문 닫기 전 점검을 규칙으로 정했어. 큰 사고까지 막아 주지는 못하지만 마음은 놓여."}]},11:{title:"알바생끼리 다퉜다",text:"태오가 자꾸 10분씩 늦어서 민지가 폭발했어. 손님 앞에서 큰 소리가 났고, 둘은 서로 말을 안 해.",concept:"갈등 관리 — 함께 일하면 부딪히는 건 당연해. 누가 옳은지보다 어떤 규칙으로 일할지를 정하는 게 먼저야.",choices:[{label:"둘을 불러 이야기를 듣고, 규칙을 함께 정한다",sk:"TP",fx:{team:10,temp:.97},text:"한 시간 동안 가게 문을 닫고 이야기했어. 지각하면 미리 연락하고 마감을 맡기로 셋이 정했어."},{label:'태오에게 "또 늦으면 시급을 깎겠다"고 한다',fx:{team:-8},text:"태오는 늦지 않게 됐어. 하지만 벌로 임금을 깎는 건 법으로 엄격히 막혀 있어서, 내 말은 지킬 수 없는 약속이었어."},{label:"둘이 알아서 풀도록 모른 척한다",fx:{team:-12,trust:-3},text:"주방 분위기가 얼어붙었어. 손님들도 눈치를 봐."}]},12:{title:"프랜차이즈 본사의 제안",text:'유명 치킨 프랜차이즈에서 연락이 왔어. "간판을 우리 걸로 바꾸시면 광고도 해 드리고 손님도 늘 거예요. 대신 매달 가맹비를 내셔야 해요."',concept:"브랜드와 독립 — 큰 이름에 기대면 편하지만, 내 가게의 이름과 방식은 내 것이 아니게 돼.",choices:[{label:"가맹점이 된다",fx:{temp:1.25,etc:40,trust:2},text:"간판이 바뀌자 손님이 몰렸어. 매달 가맹비 40만 원이 나가고, 메뉴도 본사가 정해."},{label:"우리 가게 이름을 지킨다",sk:"C",fx:{trust:5},text:'"이 동네엔 이 집이 있어야지." 단골들이 좋아했어.'},{label:"거절하고, 우리 가게의 방식을 글로 정리해 둔다",sk:"G",fx:{cash:-50,team:6},text:"조리법과 손님 응대법을 알바생들과 함께 정리했어. 언젠가 2호점을 낼 때 그대로 쓸 수 있어."}]}},Cm=[{key:"F-team",month:7,when:n=>n.team<=40,card:{title:"알바생들이 그만두겠대",text:'민지와 태오가 함께 찾아왔어. "사장님, 저희 이번 달까지만 할게요." 그동안 쌓인 게 많았나 봐.',concept:"이직의 비용 — 사람이 나가면 새로 뽑고 가르치는 데 돈과 시간이 들어. 붙잡는 값과 떠나보내는 값을 견줘 봐.",choices:[{label:"사과하고 시급을 올려 붙잡는다",sk:"T",fx:{wage:15,team:18},text:"둘은 남기로 했어. 인건비가 올랐지만, 가게는 멈추지 않았어."},{label:"보내 주고 새 사람을 뽑는다",fx:{cash:-60,team:8,temp:.88},text:"새 알바생이 일을 익힐 때까지 주문이 밀리고 실수가 잦았어."},{label:"한 사람씩 이야기를 듣고, 바꿀 점을 함께 찾는다",sk:"TP",fx:{team:14,temp:.95},text:"쉬는 시간, 일정 통보, 말투. 듣고 보니 돈보다 먼저 고칠 게 있었어. 둘은 한 달 더 지켜보기로 했어."}]}},{key:"F-frozen",month:8,when:n=>!!n.flags.frozen,card:{title:"원산지 표시 점검",text:'구청에서 원산지 표시 점검을 나온대. 냉동 수입 닭으로 바꿨는데, 메뉴판에는 아직 "국내산"이라고 적혀 있어.',concept:"원산지 표시 — 손님은 적힌 대로 믿고 사. 사실과 다르게 적으면 법을 어기는 일이고, 믿음도 함께 잃어.",choices:[{label:'메뉴판을 "수입산"으로 고치고 손님에게 알린다',sk:"P",fx:{trust:-3},text:"실망한 손님도 있었어. 그래도 점검은 문제없이 지나갔어."},{label:"국내산 닭으로 되돌린다",sk:"P",fx:{unitCost:1800,trust:5,unflag:"frozen"},text:"재료비가 다시 올랐어. 치킨 맛이 돌아왔다는 말이 들려."},{label:"메뉴판을 그대로 둔다",fx:{},text:"점검 날 아침까지 메뉴판을 고치지 않았어.",risk:{p:.7,bad:{fx:{cash:-300,trust:-15},text:"거짓 표시로 적발됐어. 큰 벌금을 냈고, 가게 앞에 위반 사실이 붙었어."},good:{text:"점검반이 다른 가게를 먼저 돌다가 시간이 없어 그냥 갔어."}}}]}},{key:"F-fee",month:9,when:n=>n.feeRate>=.2,card:{title:"배달 앱이 수수료를 올린다",text:'배달 앱에서 공지가 왔어. "다음 달부터 광고 상품 수수료가 20%에서 25%로 오릅니다." 우리 주문의 절반 이상이 이 앱에서 나와.',concept:"의존의 위험 — 한 곳에 매출을 기대면, 그곳이 조건을 바꿀 때 따를 수밖에 없어.",choices:[{label:"어쩔 수 없이 받아들인다",fx:{feeRate:.25},text:"주문은 그대로야. 떼이는 돈이 더 늘었어."},{label:"기본 상품으로 내린다",sk:"P",fx:{feeRate:.12,deliveryShare:.4,demand:.9},text:"앱 화면 아래쪽으로 밀려 주문이 줄었어. 대신 한 건마다 남는 돈이 늘었어."},{label:'"가게로 직접 주문하면 2,000원 할인" 쪽지를 상자마다 넣는다',sk:"I",fx:{feeRate:.25,deliveryShare:.4,cash:-30,trust:3},text:"앱은 그대로 두되, 단골들이 조금씩 전화와 포장으로 옮겨 왔어."}]}},{key:"F-good",month:10,when:n=>n.impact>=45,card:{title:"방송국에서 취재를 오고 싶대",text:'지역 방송 작가가 전화했어. "동네에서 착한 가게로 소문났던데, 사장님 이야기를 찍고 싶어요."',concept:"평판의 힘 — 좋은 일은 알려지면 장사에도 도움이 돼. 다만 알리려고 하는 일과 하다 보니 알려진 일은 달라.",choices:[{label:"취재에 응한다",fx:{temp:1.25,trust:5},text:"방송이 나간 주말, 가게 앞에 줄이 늘어섰어."},{label:"응하되, 알바생과 단골들 이야기를 앞세운다",sk:"T",fx:{temp:1.15,trust:5,team:8},text:"화면에는 민지와 태오, 단골 할머니가 나왔어. 알바생들이 방송을 몇 번이나 돌려 봤어."},{label:"조용히 하고 싶어서 거절한다",fx:{trust:1,impact:3},text:"방송은 나가지 않았어. 하던 일을 하던 대로 계속했어."}]}}],Pm=Object.freeze(Object.defineProperty({__proto__:null,ALT:Rm,CARDS:wm,FOLLOW:Cm},Symbol.toStringTag,{value:"Module"})),Lm=[{title:"무엇으로 만들까",text:"버려지는 플라스틱을 줄이려고 텀블러 회사를 차렸어. 첫 제품의 몸통 재료를 정해야 해. 통장에는 1,000만 원이 있어.",concept:"소셜벤처 — 사회 문제를 풀려고 만든 회사야. 돈을 벌어야 그 일을 계속할 수 있고, 돈만 좇으면 처음 뜻을 잃어.",choices:[{label:"100% 재활용 플라스틱으로 만든다",sk:"C",fx:{unitCost:1e3,impact:12,trust:3},text:'모으고 씻고 녹이는 데 손이 많이 가서 한 개당 1,000원이 더 들어. "진짜 재활용"이라는 말은 당당하게 할 수 있어.'},{label:"재활용 플라스틱을 절반 섞는다",sk:"",fx:{impact:5},text:'값과 뜻 사이에서 가운데를 골랐어. 상자에는 "재활용 50%"라고 정직하게 적었어.'},{label:"값싼 새 플라스틱으로 만든다",sk:"",fx:{unitCost:-2e3,impact:-5,flag:"frozen"},text:'재료비가 크게 줄었어. 그런데 "친환경 텀블러"라고 불러도 되는지 팀원들이 고개를 갸웃해.'}]},{title:"텀블러 한 개, 얼마 받을까",text:"온라인 상점에 올리기 직전이야. 지금 한 개를 만드는 데 드는 돈을 보고 값을 정해야 해. 좋은 뜻으로 만든 물건이면 비싸도 살까?",concept:"가격과 가치 — 손님은 물건만 사는 게 아니라 그 물건에 담긴 뜻도 함께 사. 하지만 뜻만으로는 지갑이 열리지 않아.",choices:[{label:"19,000원 — 포장을 줄이고 누구나 살 수 있게 한다",sk:"",fx:{priceSet:19e3,unitCost:-500,trust:3},text:'"친환경은 비싸다"는 생각을 깼어. 한 개당 남는 돈이 적어서 많이 팔아야 해.'},{label:"22,000원 — 비슷한 텀블러와 같은 값으로 한다",sk:"",fx:{priceSet:22e3},text:"무난한 값이야. 값으로는 눈에 띄지 않으니 이야기와 품질로 골라지게 해야 해."},{label:"26,000원 — 디자이너와 손잡고 비싸게 받는다",sk:"I",fx:{priceSet:26e3,unitCost:1200,trust:2},text:"선물로 사고 싶은 텀블러가 됐어. 사는 사람은 적어도 한 개당 남는 돈이 커."}]},{title:"어디에서 팔까",text:'대형 온라인 쇼핑몰 담당자가 연락했어. "첫 화면에 띄워 드릴게요. 대신 팔릴 때마다 수수료를 내셔야 해요."',concept:"수수료 — 많이 팔려도 떼이는 돈이 크면 남는 게 적어. 매출과 이익은 달라.",choices:[{label:"대형 쇼핑몰 첫 화면에 광고한다 (수수료 20%)",sk:"C",fx:{deliveryShare:.7,feeRate:.2,demand:1.3},text:"주문 알림이 쉴 새 없이 울려. 온라인으로 팔 때마다 5분의 1이 수수료로 나가."},{label:"친환경 제품만 모은 편집 상점에 들어간다 (수수료 12%)",sk:"P",fx:{deliveryShare:.5,feeRate:.12,demand:1.12},text:"우리 물건을 알아보는 손님들이 모이는 곳이야. 주문이 꾸준히 들어와."},{label:"장터와 학교 축제를 돌며 직접 판다",sk:"I",fx:{cash:-30,deliveryShare:0,feeRate:0,demand:.95,trust:3},text:"수수료는 0원. 손님 얼굴을 보고 이야기를 들려줄 수 있어. 새 손님은 더디게 늘어."}]},{title:'"좋은 일 하니까 월급은 적어도 되죠?"',text:'디자이너 하람이 말을 꺼냈어. "다들 그렇게 말하는데요, 저도 월세를 내야 해요. 다른 회사보다 월급이 너무 적어요."',concept:"열정페이 — 뜻이 좋다는 것이 일한 값을 적게 주는 까닭이 될 수는 없어. 사람을 지키지 못하면 뜻도 지킬 수 없어.",choices:[{label:"다른 회사만큼 월급을 올린다",sk:"T",fx:{wage:20,team:12},text:'인건비가 올랐어. 하람은 "오래 다니고 싶다"며 새 디자인을 들고 왔어.'},{label:'"우리는 뜻으로 일하는 회사잖아"라고 달랜다',sk:"",fx:{team:-15},text:"하람은 더 말하지 않았어.",risk:{p:.6,bad:{fx:{trust:-3,temp:.88},text:"그리고 다음 달, 사직서를 냈어. 새 디자이너를 구할 때까지 신제품이 멈췄어."},good:{text:"일은 계속하지만, 회의에서 말수가 줄었어."}}},{label:"월급 대신 회사의 몫(지분)을 나눠 준다",sk:"I",fx:{team:7,etc:5},text:"회사가 크면 함께 버는 구조가 됐어. 당장 월세 걱정은 그대로라 하람의 표정은 반반이야."}]},{title:"재활용 원료 값이 뛰었다",idea:!0,text:"재활용 플라스틱을 찾는 회사가 늘면서 원료 값이 올랐어. 한 개당 재료비가 1,500원 올라.",concept:"원가와 가격 — 재료비가 오르면 누군가는 그 부담을 져야 해. 손님일까, 회사일까, 처음의 약속일까.",choices:[{label:"텀블러값을 2,000원 올린다",sk:"P",fx:{unitCost:1500,price:2e3,trust:-6},text:"남는 돈은 지켰어. 장바구니에 담았다가 빼는 손님이 늘었어."},{label:"남는 돈을 줄이고 값을 그대로 둔다",sk:"C",fx:{unitCost:1500,trust:8},text:'"다 오르는데 여긴 그대로네." 단골이 늘었어. 한 개 팔 때 남는 돈이 확 줄었어.'},{label:"값싼 새 플라스틱을 섞는다",sk:"",fx:{trust:-4,impact:-8,flag:"frozen"},text:'재료비는 그대로야. 상자의 "재활용" 글자가 마음에 걸려.'}]},{title:"뚜껑에서 물이 샌다",text:'"가방 안이 다 젖었어요." 같은 후기가 50건 넘게 올라왔어. 지난달에 만든 뚜껑의 고무 패킹이 문제였어.',concept:"품질과 책임 — 잘못 만든 물건은 만든 쪽이 책임져. 숨기는 값은 고치는 값보다 늘 비싸.",choices:[{label:"산 사람 모두에게 새 뚜껑을 보내 준다",sk:"P",fx:{cash:-120,trust:6},text:'120만 원이 들었어. "말도 안 했는데 뚜껑이 왔다"는 후기가 올라왔어.'},{label:"문의한 사람에게만 바꿔 준다",sk:"",fx:{cash:-30,trust:-6},text:"돈은 아꼈어. 모르고 쓰던 손님들이 뒤늦게 알고 화를 냈어."},{label:"모두 바꿔 주고, 원인과 고친 과정을 공개한다",sk:"PI",fx:{cash:-150,trust:10,team:-3},text:'밤새 원인을 찾아 글로 올렸어. 팀은 지쳤지만 "믿을 수 있는 회사"라는 말을 들었어.'}]},{title:"대기업의 대량 주문",idea:!0,text:'큰 회사에서 사은품으로 5,000개를 주문하겠대. 조건은 우리 이름을 빼고 그 회사 로고만 넣는 것. "우리 회사의 친환경 활동"으로 홍보한대.',concept:"그린워싱 — 실제로는 환경에 별 도움이 안 되면서 친환경인 것처럼 꾸미는 일이야. 내 물건이 그 도구가 될 수도 있어.",choices:[{label:"조건대로 받는다",sk:"",fx:{cash:500,trust:-4,impact:-5},text:"한 번에 500만 원이 들어왔어. 그 회사 광고에 우리 텀블러가 나오지만 우리 이름은 어디에도 없어."},{label:"우리 이름과 재활용 이야기를 함께 넣자고 다시 제안한다",sk:"C",fx:{},text:'로고 옆에 "버려진 플라스틱 ○개로 만들었습니다"를 넣자고 했어.',risk:{p:.45,fair:!0,bad:{fx:{},text:'담당자는 "그럼 다른 곳에 맡길게요" 하고 전화를 끊었어.'},good:{fx:{cash:400,trust:5,impact:5},text:'"그게 더 진짜 같네요." 값은 조금 깎였지만 우리 이야기가 5,000명에게 전해졌어.'}}},{label:"거절하고 우리 손님에게 집중한다",sk:"",fx:{trust:3},text:'큰돈은 놓쳤어. 팀원들은 "우리답다"고 했어.'}]},{title:"후원 모금으로 300만 원이 생겼다",text:"새 색깔 텀블러를 미리 주문받는 모금(크라우드 펀딩)이 목표를 훌쩍 넘겼어. 계획에 없던 300만 원이 남았어.",concept:"기회비용 — 하나를 고르면 다른 것은 포기해야 해. 포기한 것 가운데 가장 아까운 것이 그 선택의 값이야.",choices:[{label:"밤새 일한 팀원들에게 보너스를 주고 월급을 올린다",sk:"T",fx:{cash:100,wage:10,team:20},text:"하람과 도윤이 환하게 웃었어. 다음 제품 회의가 벌써 시끌벅적해."},{label:"바다 쓰레기를 치우는 단체에 보낸다",sk:"",fx:{cash:150,impact:25,trust:8},text:"단체에서 수거한 페트병 사진을 보내왔어. 후원한 손님들이 그 글을 여기저기 퍼 날랐어."},{label:"새 틀(금형)을 살 돈으로 모아 둔다",sk:"G",fx:{cash:300},text:"통장이 든든해졌어. 작업실을 넓힐 날이 한 걸음 가까워졌어."}]},{title:"많이 팔수록 좋은 걸까",idea:!0,text:'한 손님이 물었어. "텀블러도 결국 플라스틱이잖아요. 집에 벌써 다섯 개나 있는데, 또 사는 게 환경에 좋은 건가요?"',concept:"외부 효과 — 친환경 물건도 많이 만들면 쓰레기가 돼. 물건을 파는 것과 문제를 푸는 것은 같은 일이 아닐 수 있어.",choices:[{label:"헌 텀블러를 가져오면 깎아 주고, 녹여서 다시 만든다",sk:"P",fx:{unitCost:300,impact:18,trust:4,flag:"eco"},text:"작업실 앞에 수거함을 놓았어. 한 개당 드는 돈은 조금 늘었지만, 버려질 텀블러가 새 텀블러가 돼."},{label:'"좋은 질문이네요" 하고 넘어간다',sk:"",fx:{impact:-5},text:"돈은 들지 않았어. 그 질문이 며칠 동안 머릿속을 맴돌아."},{label:'동네 카페들과 "텀블러 가져오면 300원 할인"을 함께 연다',sk:"PI",fx:{cash:-80,demand:1.04,impact:20,trust:4,flag:"eco"},text:"안내판과 스티커에 80만 원이 들었어. 카페 열두 곳이 함께해서, 사 놓고 안 쓰던 텀블러들이 가방에서 나왔어."}]},{title:'"친환경" 글자를 써도 될까',text:'상자에 "친환경 인증" 마크를 넣고 싶어. 정식 인증을 받으려면 검사비 150만 원과 두 달이 필요해. 마크가 없어도 글자는 마음대로 쓸 수 있을 것 같은데.',concept:'표시와 증명 — "친환경"이라고 적으려면 그 말을 뒷받침할 근거가 있어야 해. 근거 없는 말은 거짓 광고가 돼.',choices:[{label:"검사를 받고 정식 인증을 딴다",sk:"P",fx:{cash:-150,trust:8},text:"150만 원이 들었어. 마크 하나로 긴 설명이 필요 없어졌어."},{label:'인증 없이 "100% 친환경"이라고 크게 적는다',sk:"",fx:{temp:1.1},text:"상자가 훨씬 눈에 띄어.",risk:{p:.5,bad:{fx:{cash:-200,trust:-18},text:"그런데 경쟁 회사의 신고로 조사가 나왔어. 근거를 대지 못해 과태료를 내고 상자를 전부 다시 찍었어."},good:{text:"아직은 아무도 문제 삼지 않았어."}}},{label:"인증은 미루고, 재료와 재활용 비율을 있는 그대로 적는다",sk:"P",fx:{trust:4},text:'"재활용 플라스틱 몇 %, 나머지는 무엇"이라고 숫자로 적었어. 화려하진 않지만 거짓도 없어.'}]},{title:"포장이 자꾸 밀린다",text:"포장 담당으로 함께 일하게 된 지우는 발달 장애가 있어. 꼼꼼하지만 속도가 느려서 배송이 사흘씩 밀리고, 손님 문의가 쌓여.",concept:"함께 일하기 — 사람을 일에 맞추는 방법도 있고, 일을 사람에 맞게 바꾸는 방법도 있어. 소셜벤처는 일자리 그 자체가 목적이 되기도 해.",choices:[{label:"포장 순서를 그림 카드로 만들고, 익숙해질 때까지 기다린다",sk:"TP",fx:{temp:.95,team:10,impact:10},text:"한동안 배송이 더 밀렸어. 3주 뒤, 지우는 카드 없이도 누구보다 반듯하게 포장해."},{label:"계약을 끝내고 손이 빠른 사람을 뽑는다",sk:"",fx:{team:-12,impact:-8},text:"배송은 빨라졌어. 작업실이 조용해졌고, 누구도 그 일을 입에 올리지 않아."},{label:"지우가 잘하는 불량 검사 일로 자리를 바꾼다",sk:"TP",fx:{team:8,impact:8,trust:4},text:"지우는 남들이 놓치는 작은 흠을 찾아냈어. 포장은 다른 팀원이 맡고, 불량 후기가 줄었어."}]},{title:"내년에는 어떤 회사가 될까",text:"문을 연 지 1년이 코앞이야. 마지막 달, 내년을 위해 한 가지를 약속하기로 했어.",concept:"지속 가능성 — 올해만 잘되는 회사와 오래가는 회사는 무엇이 다를까? 처음의 뜻을 지키는 장치는 무엇일까?",choices:[{label:"해마다 이익의 10%를 환경 단체에 보내기로 규칙에 적는다",sk:"G",fx:{etc:30,impact:25,trust:6},text:"회사 규칙 첫 줄에 넣었어. 누가 대표가 되어도 지켜야 하는 약속이 됐어."},{label:"오래 일한 팀원을 공동 대표로 올린다",sk:"T",fx:{wage:15,team:18,trust:3},text:"인건비가 늘었어. 이제 내가 자리를 비워도 회사가 같은 방향으로 가."},{label:"연말 선물 철 광고에 100만 원을 쓴다",sk:"C",fx:{cash:-100,temp:1.3},text:'"올해 선물은 지구에게도 좋은 것으로." 연말 주문이 줄을 이었어.'}]}],Dm={},Um=[{key:"T-team",month:7,when:n=>n.team<=40,card:{title:"팀원들이 떠나겠대",text:'하람과 도윤이 함께 찾아왔어. "대표님, 저희 이번 달까지만 할게요." 좋은 뜻만으로 버티기에는 쌓인 게 많았나 봐.',concept:"이직의 비용 — 사람이 나가면 새로 뽑고 가르치는 데 돈과 시간이 들어. 붙잡는 값과 떠나보내는 값을 견줘 봐.",choices:[{label:"사과하고 월급을 올려 붙잡는다",sk:"T",fx:{wage:15,team:18},text:"둘은 남기로 했어. 인건비가 올랐지만 회사는 멈추지 않았어."},{label:"보내 주고 새 사람을 뽑는다",sk:"",fx:{cash:-60,team:8,temp:.88},text:"새 팀원이 일을 익힐 때까지 주문이 밀리고 실수가 잦았어."},{label:"한 사람씩 이야기를 듣고, 바꿀 점을 함께 찾는다",sk:"TP",fx:{team:14,temp:.95},text:"쉬는 날, 일의 순서, 결정에 끼는 자리. 듣고 보니 돈보다 먼저 고칠 게 있었어. 둘은 한 달 더 지켜보기로 했어."}]}},{key:"T-green",month:8,when:n=>!!n.flags.frozen,card:{title:'"친환경이라더니 새 플라스틱?"',text:'구독자가 많은 환경 유튜버가 우리 텀블러를 잘라 재료를 분석한 영상을 올렸어. "새 플라스틱이 들어 있는데 친환경이라고 판다"는 제목이야.',concept:"그린워싱 — 겉으로만 친환경인 척하는 일이야. 들키면 물건만이 아니라 회사가 하는 모든 말이 의심받아.",choices:[{label:"사과하고 재료 비율을 있는 그대로 공개한다",sk:"P",fx:{trust:-3},text:'실망한 손님도 있었어. 그래도 "숨기지 않아서 다시 본다"는 댓글이 달렸어.'},{label:"100% 재활용 플라스틱으로 되돌린다",sk:"P",fx:{unitCost:1500,trust:5,impact:8,unflag:"frozen"},text:'재료비가 다시 올랐어. 그 유튜버가 "바꿨네요" 하고 다음 영상에서 소개했어.'},{label:"대응하지 않고 잠잠해지기를 기다린다",sk:"",fx:{},text:"아무 글도 올리지 않았어.",risk:{p:.7,bad:{fx:{cash:-200,trust:-18},text:"영상이 뉴스에 실리면서 환불 요청이 쏟아졌어."},good:{text:"며칠 뒤 다른 화제에 묻혔어. 이번에는."}}}]}},{key:"T-g
