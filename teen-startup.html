 2,000원 올린다",fx:{unitCost:1800,price:2e3,trust:-6},text:'남는 돈은 지켰어. "여기도 올랐네" 하며 돌아서는 손님이 눈에 띄어.'},{label:"남는 돈을 줄이고 가격을 그대로 둔다",fx:{unitCost:1800,trust:8},text:'"다 오르는데 여긴 그대로네!" 단골이 늘었어. 대신 한 마리 팔 때 남는 돈이 확 줄었어.'},{label:"값싼 냉동 수입 닭으로 바꾼다",fx:{trust:-4,flag:"frozen"},text:'재료비는 그대로야. 그런데 "맛이 변했다"는 말이 들리기 시작했어.'}]},{title:"별점 1점 리뷰",text:'"치킨이 다 식어서 왔어요. 다시는 안 시켜요." 앱에 별점 1점이 달렸어. 사실 그날은 배달 기사가 길을 헤맨 날이야.',concept:"평판 — 눈에 보이지 않지만 가게의 큰 재산이야. 쌓는 데는 오래 걸리고 잃는 건 한순간이야.",choices:[{label:"사과 댓글을 달고 새로 튀겨 보낸다",fx:{cash:-10,trust:6},text:'손님이 리뷰를 고쳤어. "대처가 좋아서 별 다섯 개로 바꿉니다." 그 댓글을 본 다른 손님도 주문했어.'},{label:'"배달 기사님 잘못입니다"라고 답한다',fx:{trust:-8},text:'틀린 말은 아니야. 하지만 댓글을 본 사람들은 "손님이랑 싸우는 가게"로 기억했어.'},{label:"별 다섯 개 리뷰를 쓰면 콜라를 주는 행사를 연다",fx:{cash:-30,trust:2,temp:1.1},text:"별점 평균이 금방 올랐어.",risk:{p:.4,bad:{fx:{trust:-10},text:'그런데 누군가 "리뷰를 돈 주고 산다"는 글을 동네 커뮤니티에 올렸어.'},good:{text:"새 손님들이 높은 별점을 보고 주문했어."}}}]},{title:"길 건너에 대형 치킨집이 생겼다",idea:!0,text:"유명 프랜차이즈가 길 건너에 문을 열고 한 달 동안 반값 행사를 해. 우리 가게 손님이 눈에 띄게 줄었어.",concept:'경쟁과 차별화 — 값으로 싸우면 덩치 큰 쪽이 유리해. 작은 가게는 "여기만의 이유"가 필요해.',choices:[{label:"우리도 한 달 동안 할인으로 맞선다",fx:{cash:-200,trust:2,demand:.95},text:"손님은 붙잡았어. 하지만 팔수록 손해라 통장에서 200만 원이 사라졌어."},{label:"우리 가게만의 새 메뉴를 만든다",fx:{cash:-120,trust:5,demand:1.05},text:'2주 동안 밤마다 연습한 "마늘 간장 치킨"이 나왔어. 이걸 먹으러 일부러 찾아오는 손님이 생겼어.'},{label:"단골에게 쿠폰 10장에 한 마리를 준다",fx:{unitCost:500,trust:7,demand:.97},text:"단골은 떠나지 않았어. 공짜 치킨만큼 한 마리당 드는 돈이 조금 늘었어."}]},{title:"동네 축제로 300만 원이 생겼다",text:"동네 축제 단체 주문이 몰려서 예상에 없던 300만 원이 들어왔어. 이 돈을 어디에 쓸까?",concept:"기회비용 — 하나를 고르면 다른 것은 포기해야 해. 포기한 것 가운데 가장 아까운 것이 그 선택의 값이야.",choices:[{label:"고생한 알바생들에게 보너스를 주고 시급을 올린다",fx:{cash:100,wage:10,team:20},text:"민지와 태오가 환하게 웃었어. 손님한테 건네는 인사 소리부터 달라졌어."},{label:"지역 아동 센터에 치킨 50마리를 보낸다",fx:{cash:150,impact:25,trust:8},text:'아이들이 삐뚤빼뚤한 감사 편지를 보내왔어. 동네 소식지에 "착한 가게"로 실렸어.'},{label:"가게를 키울 때를 대비해 모아 둔다",fx:{cash:300},text:"통장이 든든해졌어. 가게를 넓힐 날이 한 걸음 가까워졌어."}]},{title:"포장 쓰레기 민원",idea:!0,text:'"치킨 상자랑 비닐이 골목에 너무 많이 나와요." 주민 센터로 민원이 들어갔대. 우리 가게 상자도 섞여 있어.',concept:"외부 효과 — 내 장사가 남에게 주는 피해나 도움은 가격표에 안 적혀 있어. 그 비용은 누가 내야 할까?",choices:[{label:"종이로 된 친환경 포장재로 바꾼다",fx:{unitCost:400,impact:15,trust:3,flag:"eco"},text:'한 마리당 400원이 더 들어. "여기는 비닐을 안 써서 좋다"는 리뷰가 달렸어.'},{label:"지금 포장을 그대로 쓴다",fx:{impact:-5},text:"돈은 들지 않았어. 골목 쓰레기는 그대로야."},{label:"그릇을 가져오면 500원 깎아 주는 캠페인을 연다",fx:{cash:-80,unitCost:-100,impact:20,trust:4,flag:"eco"},text:"안내판과 그릇 세척대에 80만 원이 들었어. 냄비를 들고 오는 손님이 동네 명물이 됐어."}]},{title:"유통 기한이 하루 지난 소스",text:"창고를 정리하다가 유통 기한이 어제까지인 양념 소스 40만 원어치를 발견했어. 냄새도 색도 멀쩡해 보여.",concept:"위험과 신뢰 — 아낀 돈은 작고 확실하지만, 사고가 나면 잃는 것은 크고 오래가.",choices:[{label:"아깝지만 전부 버린다",fx:{cash:-40,trust:2},text:"40만 원이 쓰레기통으로 갔어. 그래도 오늘 밤은 마음 편히 잘 수 있어."},{label:"멀쩡해 보이니 그냥 쓴다",fx:{},text:"소스를 그대로 썼어.",risk:{p:.5,bad:{fx:{cash:-200,trust:-20},text:"사흘 뒤, 배탈이 났다는 손님의 신고로 위생 점검이 나왔어. 과태료를 내고 며칠 문을 닫았어."},good:{text:"이번에는 아무 일도 없었어. 운이 좋았던 걸까?"}}},{label:"버리고, 재고 관리표를 만든다",fx:{cash:-40,team:-3,etc:-5,trust:2},text:"날마다 적는 일이 늘어 알바생들이 투덜댔어. 대신 버리는 재료가 줄어 매달 5만 원을 아끼게 됐어."}]},{title:"단체 주문 30마리가 빠졌다",idea:!0,text:"알바생 태오가 전화 주문을 적어 두지 않았어. 회사 회식용 30마리가 통째로 빠졌고, 손님은 크게 화가 났어.",concept:"책임 — 직원의 실수로 생긴 손해를 월급에서 마음대로 빼는 것은 법으로 막혀 있어. 가게의 실수는 가게가 책임져.",choices:[{label:"사장인 내가 사과하고 환불한다",fx:{cash:-60,trust:6,team:8},text:"손님 회사까지 찾아가 고개를 숙였어. 태오는 그날부터 주문을 두 번씩 확인해."},{label:"손해 본 돈을 태오 월급에서 뺀다",fx:{team:-18},text:"통장은 지켰어. 가게 안이 조용해졌어.",risk:{p:.5,bad:{fx:{team:-10,temp:.85},text:"태오가 다음 날 그만뒀어. 새 사람을 구할 때까지 주문을 다 받지 못했어."},good:{text:"태오는 말없이 일했어. 눈을 마주치지 않아."}}},{label:"환불하고, 하루 문을 닫아 주문 확인 방법을 함께 만든다",fx:{cash:-60,temp:.93,team:10,trust:8},text:'하루 매출을 포기했어. 벽에 붙인 "주문 세 번 확인" 표는 알바생들이 직접 그렸어.'}]},{title:"내년에는 어떤 가게가 될까",text:"개업 1년이 코앞이야. 마지막 달, 내년을 위해 한 가지를 약속하기로 했어.",concept:"지속 가능성 — 올해만 잘되는 가게와 오래가는 가게는 무엇이 다를까?",choices:[{label:"아동 센터에 매달 치킨을 보내기로 약속한다",fx:{etc:30,impact:25,trust:6},text:"매달 30만 원어치야. 센터 벽에 우리 가게 이름이 적힌 감사패가 걸렸어."},{label:"오래 일한 알바생을 정식 매니저로 올린다",fx:{wage:15,team:18,trust:3},text:"인건비가 늘었어. 이제 내가 자리를 비워도 가게가 똑같이 돌아가."},{label:"연말 대목 광고에 100만 원을 쓴다",fx:{cash:-100,temp:1.3},text:"동네 곳곳에 현수막이 걸렸어. 연말 주문 전화가 줄을 이었어."}]}],km={4:{title:'"사장님, 2주만 쉬어도 될까요?"',text:"알바생 민지가 시험 기간이라 2주 동안 쉬고 싶대. 하필 가게가 바빠지기 시작한 때야.",concept:"사람도 자원 — 같이 일하는 사람의 사정을 살피는 일은 비용이면서 투자야.",choices:[{label:"쉬게 하고, 그동안 내가 두 사람 몫을 한다",sk:"T",fx:{team:10,temp:.93},text:"민지는 고맙다며 시험을 보러 갔어. 2주 동안 나는 녹초가 됐고, 놓친 주문도 있었어."},{label:"2주 동안 일할 단기 알바를 구한다",sk:"P",fx:{cash:-50,team:6},text:"구인 광고와 교육에 50만 원이 들었어. 가게는 평소처럼 돌아갔어."},{label:'"지금은 바빠서 안 돼"라고 한다',fx:{team:-12},text:"민지는 알겠다고 했어.",risk:{p:.5,bad:{fx:{team:-8,temp:.9},text:"그리고 사흘 뒤, 그만두겠다는 문자가 왔어. 새 사람을 구할 때까지 일손이 모자랐어."},good:{text:"시험 전날에도 나와서 일했지만, 표정이 어두웠어."}}}]},5:{title:"식용유 값이 두 배가 됐다",idea:!0,text:"튀김 기름값이 두 배로 뛰었어. 기름을 며칠 더 쓰면 돈을 아낄 수 있지만, 오래 쓴 기름은 맛과 색이 달라져.",concept:"품질과 비용 — 아낀 돈은 장부에 바로 보이지만, 떨어진 품질은 손님이 먼저 알아채.",choices:[{label:"돈이 더 들어도 기름을 예전처럼 자주 간다",fx:{unitCost:700,trust:4},text:'한 마리당 700원이 더 들어. "여긴 기름이 깨끗해"라는 리뷰가 달렸어.'},{label:"기름을 며칠 더 쓴다",fx:{trust:-6},text:"재료비는 그대로야. 그런데 치킨 색이 거뭇해졌다는 말이 나왔어."},{label:"기름을 덜 쓰는 오븐 구이 메뉴를 더한다",sk:"I",fx:{cash:-150,unitCost:200,demand:1.04,trust:3},text:"오븐을 들이는 데 150만 원이 들었어. 담백한 맛을 찾는 새 손님이 생겼어."}]},6:{title:"인플루언서의 협찬 요청",text:'동네 맛집 계정을 운영하는 사람이 연락했어. "치킨을 보내 주시면 좋게 써 드릴게요. 광고라고는 안 적을게요."',concept:"광고와 정직 — 돈이나 물건을 받고 쓴 글은 광고라고 밝혀야 해. 숨기면 소비자를 속이는 일이 돼.",choices:[{label:'치킨을 보내고, "협찬"이라고 꼭 적어 달라고 한다',sk:"C",fx:{cash:-20,temp:1.15,trust:3},text:'"협찬받았지만 진짜 맛있다"는 글이 올라왔어. 처음 보는 손님들이 찾아왔어.'},{label:"광고 표시 없이 칭찬 글만 올려 달라고 한다",fx:{temp:1.2},text:"진짜 후기처럼 보이는 글이 올라왔고, 주문이 확 늘었어.",risk:{p:.5,bad:{fx:{trust:-12},text:'그런데 누군가 "뒷광고"라고 알아채 퍼뜨렸어. 가게 이름이 안 좋은 일로 알려졌어.'},good:{text:"아직은 아무도 눈치채지 못했어."}}},{label:"정중히 거절하고 맛으로만 승부한다",fx:{trust:2},text:"주문이 갑자기 늘지는 않았어. 대신 찜찜한 일도 없어."}]},7:{title:"옆 가게의 동업 제안",idea:!0,text:'옆 분식집 사장님이 찾아왔어. "큰 가게들 때문에 다들 힘든데, 우리 치킨이랑 떡볶이를 묶어서 같이 팔아 볼래요?"',concept:"경쟁과 협력 — 이웃 가게는 손님을 나눠 갖는 경쟁자이면서, 손님을 함께 불러오는 동료가 될 수도 있어.",choices:[{label:'함께 "치킨 떡볶이 세트"를 만든다',sk:"TI",fx:{cash:-40,demand:1.07,trust:3,impact:5},text:"메뉴판과 포장을 같이 만들었어. 두 가게 손님이 서로 오가기 시작했어."},{label:"우리 가게에서 떡볶이도 직접 판다",sk:"C",fx:{cash:-150,demand:1.08,team:-5},text:"주문은 늘었어. 주방 일이 두 배가 되어 알바생들이 힘들어하고, 옆 가게와는 서먹해졌어."},{label:"치킨 하나에만 집중한다",fx:{trust:2},text:"메뉴는 그대로야. 치킨 맛만큼은 흔들리지 않았어."}]},8:{title:"단골 회사의 정기 주문 제안",text:'근처 회사 총무팀에서 연락이 왔어. "매달 100마리씩 정기로 시킬게요. 대신 값을 10% 깎아 주세요."',concept:"협상 — 값을 깎아 주면 한 마리당 남는 돈은 줄지만, 꾸준히 들어오는 매출은 가게를 안정시켜.",choices:[{label:"10% 할인을 받아들인다",sk:"P",fx:{demand:1.08,price:-300,trust:3},text:"매달 100마리가 꼬박꼬박 나가. 평균 판매가는 조금 내려갔어."},{label:"할인 대신 음료를 얹어 주겠다고 다시 제안한다",sk:"C",fx:{},text:"값은 지키고 덤을 주겠다고 했어.",risk:{p:.45,fair:!0,bad:{fx:{},text:'총무팀은 "그럼 다른 곳에 알아볼게요" 하고 전화를 끊었어.'},good:{fx:{demand:1.08,unitCost:100},text:'"그것도 좋네요!" 값을 지키면서 정기 주문을 따냈어.'}}},{label:"정가가 아니면 팔지 않겠다고 거절한다",fx:{},text:"값은 지켰어. 정기 주문은 다른 가게로 갔어."}]},9:{title:"밤늦은 소음과 냄새 민원",idea:!0,text:'위층 주민이 찾아왔어. "밤 11시 넘어서까지 오토바이 소리와 튀김 냄새 때문에 잠을 못 자요."',concept:"외부 효과 — 내 장사가 이웃에게 주는 불편은 가격표에 안 적혀 있어. 그 비용은 누가 내야 할까?",choices:[{label:"문 닫는 시간을 밤 10시로 당긴다",fx:{demand:.94,impact:12,team:5},text:"늦은 밤 주문을 포기했어. 이웃도, 일찍 퇴근하게 된 알바생들도 고마워했어."},{label:"환기 필터를 새로 달고, 밤에는 조용히 배달한다",sk:"P",fx:{cash:-120,impact:10,trust:3},text:"120만 원이 들었어. 냄새가 줄었고, 주민이 단골이 됐어."},{label:'"장사하려면 어쩔 수 없어요"라고 답한다',fx:{impact:-8,trust:-3},text:"돈은 들지 않았어. 동네 커뮤니티에 우리 가게 이야기가 올라왔어."}]},10:{title:"보험, 들까 말까",text:'보험 설계사가 찾아왔어. "불이 나거나 손님이 탈이 나면 수천만 원이 들 수 있어요. 한 달에 8만 원이면 대비됩니다."',concept:"보험 — 일어날지 모르는 큰 손해에 대비해 작은 돈을 꾸준히 내는 일이야. 아무 일 없으면 그 돈은 사라져.",choices:[{label:"보험에 든다",sk:"P",fx:{etc:8},text:"매달 8만 원이 나가. 불이 나도 가게가 통째로 사라질 걱정은 없어."},{label:"아직은 괜찮을 것 같아 들지 않는다",fx:{},text:"보험료를 아꼈어.",risk:{p:.35,bad:{fx:{cash:-250,temp:.85},text:"그달 말, 튀김기 옆에서 작은 불이 났어. 수리비를 전부 내 돈으로 물고 며칠 문을 닫았어."},good:{text:"이번 달에는 아무 일도 없었어."}}},{label:"소화기를 사고 안전 점검표를 만든다",sk:"P",fx:{cash:-20,team:3},text:"20만 원으로 소화기 두 대를 놓고, 문 닫기 전 점검을 규칙으로 정했어. 큰 사고까지 막아 주지는 못하지만 마음은 놓여."}]},11:{title:"알바생끼리 다퉜다",text:"태오가 자꾸 10분씩 늦어서 민지가 폭발했어. 손님 앞에서 큰 소리가 났고, 둘은 서로 말을 안 해.",concept:"갈등 관리 — 함께 일하면 부딪히는 건 당연해. 누가 옳은지보다 어떤 규칙으로 일할지를 정하는 게 먼저야.",choices:[{label:"둘을 불러 이야기를 듣고, 규칙을 함께 정한다",sk:"TP",fx:{team:10,temp:.97},text:"한 시간 동안 가게 문을 닫고 이야기했어. 지각하면 미리 연락하고 마감을 맡기로 셋이 정했어."},{label:'태오에게 "또 늦으면 시급을 깎겠다"고 한다',fx:{team:-8},text:"태오는 늦지 않게 됐어. 하지만 벌로 임금을 깎는 건 법으로 엄격히 막혀 있어서, 내 말은 지킬 수 없는 약속이었어."},{label:"둘이 알아서 풀도록 모른 척한다",fx:{team:-12,trust:-3},text:"주방 분위기가 얼어붙었어. 손님들도 눈치를 봐."}]},12:{title:"프랜차이즈 본사의 제안",text:'유명 치킨 프랜차이즈에서 연락이 왔어. "간판을 우리 걸로 바꾸시면 광고도 해 드리고 손님도 늘 거예요. 대신 매달 가맹비를 내셔야 해요."',concept:"브랜드와 독립 — 큰 이름에 기대면 편하지만, 내 가게의 이름과 방식은 내 것이 아니게 돼.",choices:[{label:"가맹점이 된다",fx:{temp:1.25,etc:40,trust:2},text:"간판이 바뀌자 손님이 몰렸어. 매달 가맹비 40만 원이 나가고, 메뉴도 본사가 정해."},{label:"우리 가게 이름을 지킨다",sk:"C",fx:{trust:5},text:'"이 동네엔 이 집이 있어야지." 단골들이 좋아했어.'},{label:"거절하고, 우리 가게의 방식을 글로 정리해 둔다",sk:"G",fx:{cash:-50,team:6},text:"조리법과 손님 응대법을 알바생들과 함께 정리했어. 언젠가 2호점을 낼 때 그대로 쓸 수 있어."}]}},Vm=[{key:"F-team",month:7,when:n=>n.team<=40,card:{title:"알바생들이 그만두겠대",text:'민지와 태오가 함께 찾아왔어. "사장님, 저희 이번 달까지만 할게요." 그동안 쌓인 게 많았나 봐.',concept:"이직의 비용 — 사람이 나가면 새로 뽑고 가르치는 데 돈과 시간이 들어. 붙잡는 값과 떠나보내는 값을 견줘 봐.",choices:[{label:"사과하고 시급을 올려 붙잡는다",sk:"T",fx:{wage:15,team:18},text:"둘은 남기로 했어. 인건비가 올랐지만, 가게는 멈추지 않았어."},{label:"보내 주고 새 사람을 뽑는다",fx:{cash:-60,team:8,temp:.88},text:"새 알바생이 일을 익힐 때까지 주문이 밀리고 실수가 잦았어."},{label:"한 사람씩 이야기를 듣고, 바꿀 점을 함께 찾는다",sk:"TP",fx:{team:14,temp:.95},text:"쉬는 시간, 일정 통보, 말투. 듣고 보니 돈보다 먼저 고칠 게 있었어. 둘은 한 달 더 지켜보기로 했어."}]}},{key:"F-frozen",month:8,when:n=>!!n.flags.frozen,card:{title:"원산지 표시 점검",text:'구청에서 원산지 표시 점검을 나온대. 냉동 수입 닭으로 바꿨는데, 메뉴판에는 아직 "국내산"이라고 적혀 있어.',concept:"원산지 표시 — 손님은 적힌 대로 믿고 사. 사실과 다르게 적으면 법을 어기는 일이고, 믿음도 함께 잃어.",choices:[{label:'메뉴판을 "수입산"으로 고치고 손님에게 알린다',sk:"P",fx:{trust:-3},text:"실망한 손님도 있었어. 그래도 점검은 문제없이 지나갔어."},{label:"국내산 닭으로 되돌린다",sk:"P",fx:{unitCost:1800,trust:5,unflag:"frozen"},text:"재료비가 다시 올랐어. 치킨 맛이 돌아왔다는 말이 들려."},{label:"메뉴판을 그대로 둔다",fx:{},text:"점검 날 아침까지 메뉴판을 고치지 않았어.",risk:{p:.7,bad:{fx:{cash:-300,trust:-15},text:"거짓 표시로 적발됐어. 큰 벌금을 냈고, 가게 앞에 위반 사실이 붙었어."},good:{text:"점검반이 다른 가게를 먼저 돌다가 시간이 없어 그냥 갔어."}}}]}},{key:"F-fee",month:9,when:n=>n.feeRate>=.2,card:{title:"배달 앱이 수수료를 올린다",text:'배달 앱에서 공지가 왔어. "다음 달부터 광고 상품 수수료가 20%에서 25%로 오릅니다." 우리 주문의 절반 이상이 이 앱에서 나와.',concept:"의존의 위험 — 한 곳에 매출을 기대면, 그곳이 조건을 바꿀 때 따를 수밖에 없어.",choices:[{label:"어쩔 수 없이 받아들인다",fx:{feeRate:.25},text:"주문은 그대로야. 떼이는 돈이 더 늘었어."},{label:"기본 상품으로 내린다",sk:"P",fx:{feeRate:.12,deliveryShare:.4,demand:.9},text:"앱 화면 아래쪽으로 밀려 주문이 줄었어. 대신 한 건마다 남는 돈이 늘었어."},{label:'"가게로 직접 주문하면 2,000원 할인" 쪽지를 상자마다 넣는다',sk:"I",fx:{feeRate:.25,deliveryShare:.4,cash:-30,trust:3},text:"앱은 그대로 두되, 단골들이 조금씩 전화와 포장으로 옮겨 왔어."}]}},{key:"F-good",month:10,when:n=>n.impact>=45,card:{title:"방송국에서 취재를 오고 싶대",text:'지역 방송 작가가 전화했어. "동네에서 착한 가게로 소문났던데, 사장님 이야기를 찍고 싶어요."',concept:"평판의 힘 — 좋은 일은 알려지면 장사에도 도움이 돼. 다만 알리려고 하는 일과 하다 보니 알려진 일은 달라.",choices:[{label:"취재에 응한다",fx:{temp:1.25,trust:5},text:"방송이 나간 주말, 가게 앞에 줄이 늘어섰어."},{label:"응하되, 알바생과 단골들 이야기를 앞세운다",sk:"T",fx:{temp:1.15,trust:5,team:8},text:"화면에는 민지와 태오, 단골 할머니가 나왔어. 알바생들이 방송을 몇 번이나 돌려 봤어."},{label:"조용히 하고 싶어서 거절한다",fx:{trust:1,impact:3},text:"방송은 나가지 않았어. 하던 일을 하던 대로 계속했어."}]}}],zm=Object.freeze(Object.defineProperty({__proto__:null,ALT:km,CARDS:Om,FOLLOW:Vm},Symbol.toStringTag,{value:"Module"})),Gm=[{title:"무엇으로 만들까",text:"버려지는 플라스틱을 줄이려고 텀블러 회사를 차렸어. 첫 제품의 몸통 재료를 정해야 해. 통장에는 1,000만 원이 있어.",concept:"소셜벤처 — 사회 문제를 풀려고 만든 회사야. 돈을 벌어야 그 일을 계속할 수 있고, 돈만 좇으면 처음 뜻을 잃어.",choices:[{label:"100% 재활용 플라스틱으로 만든다",sk:"C",fx:{unitCost:1e3,impact:12,trust:3},text:'모으고 씻고 녹이는 데 손이 많이 가서 한 개당 1,000원이 더 들어. "진짜 재활용"이라는 말은 당당하게 할 수 있어.'},{label:"재활용 플라스틱을 절반 섞는다",sk:"",fx:{impact:5},text:'값과 뜻 사이에서 가운데를 골랐어. 상자에는 "재활용 50%"라고 정직하게 적었어.'},{label:"값싼 새 플라스틱으로 만든다",sk:"",fx:{unitCost:-2e3,impact:-5,flag:"frozen"},text:'재료비가 크게 줄었어. 그런데 "친환경 텀블러"라고 불러도 되는지 팀원들이 고개를 갸웃해.'}]},{title:"텀블러 한 개, 얼마 받을까",text:"온라인 상점에 올리기 직전이야. 지금 한 개를 만드는 데 드는 돈을 보고 값을 정해야 해. 좋은 뜻으로 만든 물건이면 비싸도 살까?",concept:"가격과 가치 — 손님은 물건만 사는 게 아니라 그 물건에 담긴 뜻도 함께 사. 하지만 뜻만으로는 지갑이 열리지 않아.",choices:[{label:"19,000원 — 포장을 줄이고 누구나 살 수 있게 한다",sk:"",fx:{priceSet:19e3,unitCost:-500,trust:3},text:'"친환경은 비싸다"는 생각을 깼어. 한 개당 남는 돈이 적어서 많이 팔아야 해.'},{label:"22,000원 — 비슷한 텀블러와 같은 값으로 한다",sk:"",fx:{priceSet:22e3},text:"무난한 값이야. 값으로는 눈에 띄지 않으니 이야기와 품질로 골라지게 해야 해."},{label:"26,000원 — 디자이너와 손잡고 비싸게 받는다",sk:"I",fx:{priceSet:26e3,unitCost:1200,trust:2},text:"선물로 사고 싶은 텀블러가 됐어. 사는 사람은 적어도 한 개당 남는 돈이 커."}]},{title:"어디에서 팔까",text:'대형 온라인 쇼핑몰 담당자가 연락했어. "첫 화면에 띄워 드릴게요. 대신 팔릴 때마다 수수료를 내셔야 해요."',concept:"수수료 — 많이 팔려도 떼이는 돈이 크면 남는 게 적어. 매출과 이익은 달라.",choices:[{label:"대형 쇼핑몰 첫 화면에 광고한다 (수수료 20%)",sk:"C",fx:{deliveryShare:.7,feeRate:.2,demand:1.3},text:"주문 알림이 쉴 새 없이 울려. 온라인으로 팔 때마다 5분의 1이 수수료로 나가."},{label:"친환경 제품만 모은 편집 상점에 들어간다 (수수료 12%)",sk:"P",fx:{deliveryShare:.5,feeRate:.12,demand:1.12},text:"우리 물건을 알아보는 손님들이 모이는 곳이야. 주문이 꾸준히 들어와."},{label:"장터와 학교 축제를 돌며 직접 판다",sk:"I",fx:{cash:-30,deliveryShare:0,feeRate:0,demand:.95,trust:3},text:"수수료는 0원. 손님 얼굴을 보고 이야기를 들려줄 수 있어. 새 손님은 더디게 늘어."}]},{title:'"좋은 일 하니까 월급은 적어도 되죠?"',text:'디자이너 하람이 말을 꺼냈어. "다들 그렇게 말하는데요, 저도 월세를 내야 해요. 다른 회사보다 월급이 너무 적어요."',concept:"열정페이 — 뜻이 좋다는 것이 일한 값을 적게 주는 까닭이 될 수는 없어. 사람을 지키지 못하면 뜻도 지킬 수 없어.",choices:[{label:"다른 회사만큼 월급을 올린다",sk:"T",fx:{wage:20,team:12},text:'인건비가 올랐어. 하람은 "오래 다니고 싶다"며 새 디자인을 들고 왔어.'},{label:'"우리는 뜻으로 일하는 회사잖아"라고 달랜다',sk:"",fx:{team:-15},text:"하람은 더 말하지 않았어.",risk:{p:.6,bad:{fx:{trust:-3,temp:.88},text:"그리고 다음 달, 사직서를 냈어. 새 디자이너를 구할 때까지 신제품이 멈췄어."},good:{text:"일은 계속하지만, 회의에서 말수가 줄었어."}}},{label:"월급 대신 회사의 몫(지분)을 나눠 준다",sk:"I",fx:{team:7,etc:5},text:"회사가 크면 함께 버는 구조가 됐어. 당장 월세 걱정은 그대로라 하람의 표정은 반반이야."}]},{title:"재활용 원료 값이 뛰었다",idea:!0,text:"재활용 플라스틱을 찾는 회사가 늘면서 원료 값이 올랐어. 한 개당 재료비가 1,500원 올라.",concept:"원가와 가격 — 재료비가 오르면 누군가는 그 부담을 져야 해. 손님일까, 회사일까, 처음의 약속일까.",choices:[{label:"텀블러값을 2,000원 올린다",sk:"P",fx:{unitCost:1500,price:2e3,trust:-6},text:"남는 돈은 지켰어. 장바구니에 담았다가 빼는 손님이 늘었어."},{label:"남는 돈을 줄이고 값을 그대로 둔다",sk:"C",fx:{unitCost:1500,trust:8},text:'"다 오르는데 여긴 그대로네." 단골이 늘었어. 한 개 팔 때 남는 돈이 확 줄었어.'},{label:"값싼 새 플라스틱을 섞는다",sk:"",fx:{trust:-4,impact:-8,flag:"frozen"},text:'재료비는 그대로야. 상자의 "재활용" 글자가 마음에 걸려.'}]},{title:"뚜껑에서 물이 샌다",text:'"가방 안이 다 젖었어요." 같은 후기가 50건 넘게 올라왔어. 지난달에 만든 뚜껑의 고무 패킹이 문제였어.',concept:"품질과 책임 — 잘못 만든 물건은 만든 쪽이 책임져. 숨기는 값은 고치는 값보다 늘 비싸.",choices:[{label:"산 사람 모두에게 새 뚜껑을 보내 준다",sk:"P",fx:{cash:-120,trust:6},text:'120만 원이 들었어. "말도 안 했는데 뚜껑이 왔다"는 후기가 올라왔어.'},{label:"문의한 사람에게만 바꿔 준다",sk:"",fx:{cash:-30,trust:-6},text:"돈은 아꼈어. 모르고 쓰던 손님들이 뒤늦게 알고 화를 냈어."},{label:"모두 바꿔 주고, 원인과 고친 과정을 공개한다",sk:"PI",fx:{cash:-150,trust:10,team:-3},text:'밤새 원인을 찾아 글로 올렸어. 팀은 지쳤지만 "믿을 수 있는 회사"라는 말을 들었어.'}]},{title:"대기업의 대량 주문",idea:!0,text:'큰 회사에서 사은품으로 5,000개를 주문하겠대. 조건은 우리 이름을 빼고 그 회사 로고만 넣는 것. "우리 회사의 친환경 활동"으로 홍보한대.',concept:"그린워싱 — 실제로는 환경에 별 도움이 안 되면서 친환경인 것처럼 꾸미는 일이야. 내 물건이 그 도구가 될 수도 있어.",choices:[{label:"조건대로 받는다",sk:"",fx:{cash:500,trust:-4,impact:-5},text:"한 번에 500만 원이 들어왔어. 그 회사 광고에 우리 텀블러가 나오지만 우리 이름은 어디에도 없어."},{label:"우리 이름과 재활용 이야기를 함께 넣자고 다시 제안한다",sk:"C",fx:{},text:'로고 옆에 "버려진 플라스틱 ○개로 만들었습니다"를 넣자고 했어.',risk:{p:.45,fair:!0,bad:{fx:{},text:'담당자는 "그럼 다른 곳에 맡길게요" 하고 전화를 끊었어.'},good:{fx:{cash:400,trust:5,impact:5},text:'"그게 더 진짜 같네요." 값은 조금 깎였지만 우리 이야기가 5,000명에게 전해졌어.'}}},{label:"거절하고 우리 손님에게 집중한다",sk:"",fx:{trust:3},text:'큰돈은 놓쳤어. 팀원들은 "우리답다"고 했어.'}]},{title:"후원 모금으로 300만 원이 생겼다",text:"새 색깔 텀블러를 미리 주문받는 모금(크라우드 펀딩)이 목표를 훌쩍 넘겼어. 계획에 없던 300만 원이 남았어.",concept:"기회비용 — 하나를 고르면 다른 것은 포기해야 해. 포기한 것 가운데 가장 아까운 것이 그 선택의 값이야.",choices:[{label:"밤새 일한 팀원들에게 보너스를 주고 월급을 올린다",sk:"T",fx:{cash:100,wage:10,team:20},text:"하람과 도윤이 환하게 웃었어. 다음 제품 회의가 벌써 시끌벅적해."},{label:"바다 쓰레기를 치우는 단체에 보낸다",sk:"",fx:{cash:150,impact:25,trust:8},text:"단체에서 수거한 페트병 사진을 보내왔어. 후원한 손님들이 그 글을 여기저기 퍼 날랐어."},{label:"새 틀(금형)을 살 돈으로 모아 둔다",sk:"G",fx:{cash:300},text:"통장이 든든해졌어. 작업실을 넓힐 날이 한 걸음 가까워졌어."}]},{title:"많이 팔수록 좋은 걸까",idea:!0,text:'한 손님이 물었어. "텀블러도 결국 플라스틱이잖아요. 집에 벌써 다섯 개나 있는데, 또 사는 게 환경에 좋은 건가요?"',concept:"외부 효과 — 친환경 물건도 많이 만들면 쓰레기가 돼. 물건을 파는 것과 문제를 푸는 것은 같은 일이 아닐 수 있어.",choices:[{label:"헌 텀블러를 가져오면 깎아 주고, 녹여서 다시 만든다",sk:"P",fx:{unitCost:300,impact:18,trust:4,flag:"eco"},text:"작업실 앞에 수거함을 놓았어. 한 개당 드는 돈은 조금 늘었지만, 버려질 텀블러가 새 텀블러가 돼."},{label:'"좋은 질문이네요" 하고 넘어간다',sk:"",fx:{impact:-5},text:"돈은 들지 않았어. 그 질문이 며칠 동안 머릿속을 맴돌아."},{label:'동네 카페들과 "텀블러 가져오면 300원 할인"을 함께 연다',sk:"PI",fx:{cash:-80,demand:1.04,impact:20,trust:4,flag:"eco"},text:"안내판과 스티커에 80만 원이 들었어. 카페 열두 곳이 함께해서, 사 놓고 안 쓰던 텀블러들이 가방에서 나왔어."}]},{title:'"친환경" 글자를 써도 될까',text:'상자에 "친환경 인증" 마크를 넣고 싶어. 정식 인증을 받으려면 검사비 150만 원과 두 달이 필요해. 마크가 없어도 글자는 마음대로 쓸 수 있을 것 같은데.',concept:'표시와 증명 — "친환경"이라고 적으려면 그 말을 뒷받침할 근거가 있어야 해. 근거 없는 말은 거짓 광고가 돼.',choices:[{label:"검사를 받고 정식 인증을 딴다",sk:"P",fx:{cash:-150,trust:8},text:"150만 원이 들었어. 마크 하나로 긴 설명이 필요 없어졌어."},{label:'인증 없이 "100% 친환경"이라고 크게 적는다',sk:"",fx:{temp:1.1},text:"상자가 훨씬 눈에 띄어.",risk:{p:.5,bad:{fx:{cash:-200,trust:-18},text:"그런데 경쟁 회사의 신고로 조사가 나왔어. 근거를 대지 못해 과태료를 내고 상자를 전부 다시 찍었어."},good:{text:"아직은 아무도 문제 삼지 않았어."}}},{label:"인증은 미루고, 재료와 재활용 비율을 있는 그대로 적는다",sk:"P",fx:{trust:4},text:'"재활용 플라스틱 몇 %, 나머지는 무엇"이라고 숫자로 적었어. 화려하진 않지만 거짓도 없어.'}]},{title:"포장이 자꾸 밀린다",text:"포장 담당으로 함께 일하게 된 지우는 발달 장애가 있어. 꼼꼼하지만 속도가 느려서 배송이 사흘씩 밀리고, 손님 문의가 쌓여.",concept:"함께 일하기 — 사람을 일에 맞추는 방법도 있고, 일을 사람에 맞게 바꾸는 방법도 있어. 소셜벤처는 일자리 그 자체가 목적이 되기도 해.",choices:[{label:"포장 순서를 그림 카드로 만들고, 익숙해질 때까지 기다린다",sk:"TP",fx:{temp:.95,team:10,impact:10},text:"한동안 배송이 더 밀렸어. 3주 뒤, 지우는 카드 없이도 누구보다 반듯하게 포장해."},{label:"계약을 끝내고 손이 빠른 사람을 뽑는다",sk:"",fx:{team:-12,impact:-8},text:"배송은 빨라졌어. 작업실이 조용해졌고, 누구도 그 일을 입에 올리지 않아."},{label:"지우가 잘하는 불량 검사 일로 자리를 바꾼다",sk:"TP",fx:{team:8,impact:8,trust:4},text:"지우는 남들이 놓치는 작은 흠을 찾아냈어. 포장은 다른 팀원이 맡고, 불량 후기가 줄었어."}]},{title:"내년에는 어떤 회사가 될까",text:"문을 연 지 1년이 코앞이야. 마지막 달, 내년을 위해 한 가지를 약속하기로 했어.",concept:"지속 가능성 — 올해만 잘되는 회사와 오래가는 회사는 무엇이 다를까? 처음의 뜻을 지키는 장치는 무엇일까?",choices:[{label:"해마다 이익의 10%를 환경 단체에 보내기로 규칙에 적는다",sk:"G",fx:{etc:30,impact:25,trust:6},text:"회사 규칙 첫 줄에 넣었어. 누가 대표가 되어도 지켜야 하는 약속이 됐어."},{label:"오래 일한 팀원을 공동 대표로 올린다",sk:"T",fx:{wage:15,team:18,trust:3},text:"인건비가 늘었어. 이제 내가 자리를 비워도 회사가 같은 방향으로 가."},{label:"연말 선물 철 광고에 100만 원을 쓴다",sk:"C",fx:{cash:-100,temp:1.3},text:'"올해 선물은 지구에게도 좋은 것으로." 연말 주문이 줄을 이었어.'}]}],Hm={4:{title:'"일주일에 나흘만 일해도 될까요?"',text:'제작 담당 도윤이 말을 꺼냈어. "환경 단체 활동을 하고 싶어서요. 나흘만 일하고, 그만큼 월급은 덜 받을게요." 하필 주문이 늘기 시작한 때야.',concept:"일하는 방식 — 일한 시간과 해낸 일의 양이 꼭 같이 가지는 않아. 사람마다 맞는 방식을 찾는 것도 경영이야.",choices:[{label:"받아들인다",sk:"T",fx:{team:10,temp:.95},text:"도윤은 나흘 동안 전보다 더 몰입해서 일했어. 그래도 하루가 비는 만큼 출고가 조금 밀렸어."},{label:"닷새는 지키되, 하루는 집에서 일하게 한다",sk:"P",fx:{team:5},text:"서로 한 걸음씩 물러섰어. 도윤은 집에서 일하는 날 저녁에 활동을 나가."},{label:'"지금은 바빠서 안 돼"라고 한다',sk:"",fx:{team:-10},text:"도윤은 알겠다고 했어.",risk:{p:.4,bad:{fx:{team:-6,temp:.9},text:"그리고 두 주 뒤, 다른 회사로 옮기겠다고 했어. 새 사람이 기계를 익힐 때까지 만드는 양이 줄었어."},good:{text:"일은 그대로 하지만, 퇴근 시간만 되면 말없이 사라져."}}}]},5:{title:"친환경 텀블러를 비닐에 싸서 보낸다?",idea:!0,text:'택배로 보낼 때 깨지지 않게 감싸는 비닐 뽁뽁이가 가장 싸. 그런데 한 손님이 후기에 사진을 올렸어. "환경을 생각한다면서 비닐이 한가득."',concept:"일관성 — 손님은 물건만이 아니라 물건이 오는 과정 전체를 봐. 말과 행동이 다르면 좋은 물건도 믿음을 잃어.",choices:[{label:"종이 완충재로 바꾼다",sk:"P",fx:{unitCost:400,impact:10,trust:3},text:'한 개당 400원이 더 들어. "상자를 열 때부터 다르다"는 후기가 달렸어.'},{label:"깨지는 것보다는 낫다고 보고 비닐을 그대로 쓴다",sk:"",fx:{impact:-6,trust:-2},text:"돈은 들지 않았어. 비슷한 후기가 또 올라왔어."},{label:"동네에서 헌 신문과 자투리 천을 모아 감싼다",sk:"I",fx:{cash:-40,unitCost:-100,impact:12,team:-3},text:"수거함을 만들고 모으러 다니느라 일이 늘었어. 상자마다 다른 신문이 들어 있어서 손님들이 재미있어해."}]},6:{title:"인기 캐릭터와 꼭 닮은 그림",text:'요즘 가장 인기 있는 캐릭터를 비슷하게 그려 넣으면 잘 팔릴 거라는 말이 나왔어. 디자이너 하람은 고개를 저어. "그건 남의 그림이에요."',concept:"저작권 — 남이 만든 그림과 캐릭터는 그 사람의 재산이야. 쓰려면 허락을 받고 값을 내야 해.",choices:[{label:"캐릭터 회사에 사용료를 내고 정식으로 쓴다",sk:"C",fx:{cash:-150,demand:1.08},text:"계약서를 쓰고 150만 원을 냈어. 캐릭터 팬들이 찾아와서 주문이 늘었어."},{label:"살짝만 바꿔서 비슷하게 그려 넣는다",sk:"",fx:{temp:1.2},text:"올리자마자 주문이 몰렸어.",risk:{p:.6,bad:{fx:{cash:-250,trust:-10},text:"2주 뒤, 캐릭터 회사에서 경고장이 왔어. 남은 물건을 전부 버리고 합의금을 물었어."},good:{text:"아직은 아무 연락이 없어. 하람은 그 제품 이야기를 꺼내지 않아."}}},{label:"하람이 그린 우리만의 캐릭터를 만든다",sk:"I",fx:{cash:-30,demand:1.03,trust:3,team:5},text:'병뚜껑에서 태어난 고래 "뚜꾸"가 나왔어. 처음엔 아무도 몰랐지만, 조금씩 알아보는 사람이 생겨.'}]},7:{title:"3,000원짜리 텀블러가 나왔다",idea:!0,text:'대형 생활용품 매장에서 3,000원짜리 텀블러를 내놨어. 우리 것의 7분의 1 값이야. "굳이 비싼 걸 살 까닭이 있나요?"라는 문의가 와.',concept:"경쟁과 차별화 — 값으로 싸우면 덩치 큰 쪽이 이겨. 작은 회사는 값이 아닌 까닭으로 골라져야 해.",choices:[{label:"우리도 값을 2,000원 내린다",sk:"",fx:{price:-2e3,trust:1},text:"조금 더 팔렸어. 그래도 3,000원과는 견줄 수 없고, 한 개당 남는 돈만 줄었어."},{label:"고장 나면 평생 고쳐 주고 부품을 바꿔 준다고 약속한다",sk:"PI",fx:{unitCost:300,trust:7},text:'고무 패킹과 뚜껑을 따로 보내 주기 시작했어. "하나 사서 10년 쓴다"는 말이 우리 광고가 됐어.'},{label:'"오래 쓰는 것이 진짜 친환경" 영상을 만든다',sk:"C",fx:{cash:-100,trust:5,impact:5},text:"싼 텀블러를 열 개 사서 서랍에 넣어 두는 것과 하나를 오래 쓰는 것을 견주는 영상이야. 생각보다 많이 퍼졌어."}]},8:{title:"투자자가 찾아왔다",text:'한 투자 회사가 큰돈을 넣겠대. 조건이 있어. "3년 안에 매출을 열 배로 키워야 합니다. 재료비도 줄이셔야 하고요."',concept:"투자 — 남의 돈이 들어오면 그 사람의 뜻도 함께 들어와. 얼마를 받느냐만큼 누구에게 받느냐가 중요해.",choices:[{label:"투자를 받는다",sk:"C",fx:{cash:800,demand:1.1,team:-6},text:'통장에 800만 원이 들어왔어. 달마다 성적표를 보내야 하고, 회의 때마다 "더 싸게, 더 많이"라는 말을 들어.'},{label:"우리 손님들에게 조금씩 투자받는다",sk:"G",fx:{cash:300,trust:5,impact:5},text:"손님 삼백 명이 만 원씩 보탰어. 큰돈은 아니지만, 우리 편인 주인이 삼백 명 생겼어."},{label:"받지 않고 번 돈으로 천천히 간다",sk:"",fx:{trust:2,team:3},text:"속도는 느려. 방향은 우리가 정해."}]},9:{title:"뚜껑 공장의 소문",idea:!0,text:"우리 뚜껑을 만드는 공장이 값이 싼 까닭을 들었어. 일하는 사람들이 밤새 일하고도 제값을 못 받는다는 거야. 계약서에는 아무 문제가 없어.",concept:"공급망 책임 — 내 물건을 만드는 데 든 다른 사람의 수고까지가 내 물건이야. 값싼 재료 뒤에 누가 있는지 볼 책임이 있어.",choices:[{label:"공장에 가서 확인하고, 값을 올려 줄 테니 고치라고 요구한다",sk:"P",fx:{unitCost:500,impact:12,trust:4},text:"한 개당 500원이 더 들어. 석 달 뒤, 공장에 밤 근무 수당이 생겼다는 소식을 들었어."},{label:"계약에 문제가 없으니 모른 척한다",sk:"",fx:{},text:"주문은 그대로 넣었어.",risk:{p:.5,bad:{fx:{trust:-15,impact:-10},text:"한 달 뒤, 그 공장이 뉴스에 나왔어. 납품받는 회사 목록에 우리 이름이 있었어."},good:{text:"아직은 조용해. 뚜껑을 볼 때마다 그 소문이 떠올라."}}},{label:"값이 비싸도 믿을 수 있는 공장으로 바꾼다",sk:"P",fx:{unitCost:900,impact:10,trust:3,temp:.95},text:"공장을 옮기는 동안 물건이 모자랐고, 한 개당 900원이 더 들어. 마음은 편해졌어. 다만 먼저 공장 사람들의 사정은 달라지지 않았어."}]},10:{title:"지원금 신청서",text:'소셜벤처를 돕는 지원금을 신청할 수 있어. 뽑히려면 "만든 일자리 수"가 많아야 한대. 가끔 도와주는 친구들까지 직원으로 적으면 쉽게 될 것 같아.',concept:"지원금 — 좋은 뜻을 가진 회사를 돕는 돈이지만, 거짓으로 받으면 도로 내놓아야 하고 다시는 못 받아.",choices:[{label:"있는 그대로 적어서 낸다",sk:"P",fx:{},text:"직원 수 칸에 진짜 숫자를 적었어.",risk:{p:.4,fair:!0,bad:{fx:{},text:'이번에는 떨어졌어. 심사평에 "내년에 다시 보고 싶다"고 적혀 있었어.'},good:{fx:{cash:300},text:'뽑혔어! 300만 원이 들어왔고, 심사 위원이 "숫자보다 내용이 좋았다"고 했어.'}}},{label:"친구들까지 직원으로 적어서 낸다",sk:"",fx:{cash:500},text:"500만 원을 받았어.",risk:{p:.5,bad:{fx:{cash:-700,trust:-10},text:"석 달 뒤 현장 점검에서 들통났어. 받은 돈에 벌금까지 물었고, 앞으로 3년 동안 신청할 수 없어."},good:{text:"점검은 아직 오지 않았어."}}},{label:"신청하지 않고 장사에 집중한다",sk:"",fx:{team:2},text:"서류 쓸 시간에 신제품을 다듬었어. 남의 돈에 기대지 않는다는 자부심이 생겼어."}]},11:{title:"뜻이 먼저야, 회사가 먼저야",text:'회의에서 하람과 도윤이 맞붙었어. 하람은 "싼 재료를 써서라도 회사가 살아야 뜻도 지킨다"고 하고, 도윤은 "그럴 거면 이 회사를 왜 하느냐"고 해. 둘 다 틀린 말은 아니야.',concept:"사명과 생존 — 소셜벤처는 돈과 뜻 사이에서 늘 흔들려. 무엇을 끝까지 지킬지 미리 정해 두면 흔들릴 때 돌아올 곳이 생겨.",choices:[{label:'다 함께 "절대 바꾸지 않을 세 가지"를 정한다',sk:"TP",fx:{team:10,temp:.97},text:"반나절 동안 일을 멈추고 이야기했어. 벽에 세 줄이 붙었고, 그 밖의 것은 형편에 따라 바꾸기로 했어."},{label:"대표인 내가 정하고 알려 준다",sk:"",fx:{team:-8},text:"결정은 빨랐어. 진 쪽은 말이 없어졌고, 이긴 쪽도 편해 보이지 않아."},{label:"시간이 지나면 풀리겠지 하고 둔다",sk:"",fx:{team:-12,trust:-3},text:"둘은 서로 필요한 말만 해. 손님 문의에 답하는 말투까지 무뚝뚝해졌어."}]},12:{title:"전국 매장에 넣어 주겠대",text:"큰 유통 회사가 전국 매장에 우리 텀블러를 넣어 주겠대. 대신 다른 곳에서는 팔지 말고, 매달 판촉비를 내야 해.",concept:"규모와 영향 — 세상을 바꾸는 방법은 내가 커지는 것만이 아니야. 방법을 나눠서 여럿이 함께 커지는 길도 있어.",choices:[{label:"전국 매장에만 팔기로 계약한다",sk:"",fx:{temp:1.25,etc:40,trust:2},text:"전국에서 우리 텀블러가 보여. 매달 판촉비 40만 원이 나가고, 값과 진열은 유통 회사가 정해."},{label:"거절하고 우리 손님과 동네 가게를 지킨다",sk:"C",fx:{trust:5},text:"처음부터 함께한 동네 가게 사장님들이 고맙다고 했어."},{label:"거절하고, 우리가 만드는 방법을 누구나 볼 수 있게 공개한다",sk:"GI",fx:{cash:-50,impact:15,team:6},text:'기계 설계도와 재료 섞는 비율을 글과 영상으로 올렸어. 다른 지역의 청년들이 "우리도 만들어 볼게요" 하고 연락해 왔어.'}]}},Wm=[{key:"T-team",month:7,when:n=>n.team<=40,card:{title:"팀원들이 떠나겠대",text:'하람과 도윤이 함께 찾아왔어. "대표님, 저희 이번 달까지만 할게요." 좋은 뜻만으로 버티기에는 쌓인 게 많았나 봐.',concept:"이직의 비용 — 사람이 나가면 새로 뽑고 가르치는 데 돈과 시간이 들어. 붙잡는 값과 떠나보내는 값을 견줘 봐.",choices:[{label:"사과하고 월급을 올려 붙잡는다",sk:"T",fx:{wage:15,team:18},text:"둘은 남기로 했어. 인건비가 올랐지만 회사는 멈추지 않았어."},{label:"보내 주고 새 사람을 뽑는다",sk:"",fx:{cash:-60,team:8,temp:.88},text:"새 팀원이 일을 익힐 때까지 주문이 밀리고 실수가 잦았어."},{label:"한 사람씩 이야기를 듣고, 바꿀 점을 함께 찾는다",sk:"TP",fx:{team:14,temp:.95},text:"쉬는 날, 일의 순서, 결정에 끼는 자리. 듣고 보니 돈보다 먼저 고칠 게 있었어. 둘은 한 달 더 지켜보기로 했어."}]}},{key:"T-green",month:8,when:n=>!!n.flags.frozen,card:{title:'"친환경이라더니 새 플라스틱?"',text:'구독자가 많은 환경 유튜버가 우리 텀블러를 잘라 재료를 분석한 영상을 올렸어. "새 플라스틱이 들어 있는데 친환경이라고 판다"는 제목이야.',concept:"그린워싱 — 겉으로만 친환경인 척하는 일이야. 들키면 물건만이 아니라 회사가 하는 모든 말이 의심받아.",choices:[{label:"사과하고 재료 비율을 있는 그대로 공개한다",sk:"P",fx:{trust:-3},text:'실망한 손님도 있었어. 그래도 "숨기지 않아서 다시 본다"는 댓글이 달렸어.'},{label:"100% 재활용 플라스틱으로 되돌린다",sk:"P",fx:{unitCost:1500,trust:5,impact:8,unflag:"frozen"},text:'재료비가 다시 올랐어. 그 유튜버가 "바꿨네요" 하고 다음 영상에서 소개했어.'},{label:"대응하지 않고 잠잠해지기를 기다린다",sk:"",fx:{},text:"아무 글도 올리지 않았어.",risk:{p:.7,bad:{fx:{cash:-200,trust:-18},text:"영상이 뉴스에 실리면서 환불 요청이 쏟아졌어."},good:{text:"며칠 뒤 다른 화제에 묻혔어. 이번에는."}}}]}},{key:"T-good",month:10,when:n=>n.impact>=45,card:{title:"환경 다큐에서 찍고 싶대",text:'방송국 작가가 전화했어. "버려진 플라스틱으로 텀블러를 만드는 청년 회사를 다큐에 담고 싶어요."',concept:"평판의 힘 — 좋은 일은 알려지면 장사에도 도움이 돼. 다만 알리려고 하는 일과 하다 보니 알려진 일은 달라.",choices:[{label:"촬영에 응한다",sk:"",fx:{temp:1.25,trust:5},text:"방송이 나간 날 밤, 주문이 평소의 몇 배로 몰렸어."},{label:"응하되, 팀원들과 수거를 돕는 이웃들을 앞세운다",sk:"T",fx:{temp:1.15,trust:5,team:8},text:"화면에는 하람, 도윤, 지우, 그리고 병뚜껑을 모아 오는 동네 어르신이 나왔어."},{label:"조용히 하고 싶어서 거절한다",sk:"",fx:{trust:1,impact:3},text:"방송은 나가지 않았어. 하던 일을 하던 대로 계속했어."}]}}],qm=Object.freeze(Object.defineProperty({__proto__:null,ALT:Hm,CARDS:Gm,FOLLOW:Wm},Symbol.toStringTag,{value:"Module"})),Ym=[{title:"어떤 AI를 쓸까",text:"모르는 문제를 물으면 AI가 풀이를 알려 주는 공부 앱을 만들었어. 앱 속 AI는 다른 회사에서 빌려 쓰고, 회원이 물을 때마다 사용료를 내. 통장에는 1,000만 원이 있어.",concept:"변동비 — 회원이 늘수록 함께 늘어나는 돈이야. 앱은 한번 만들면 끝일 것 같지만, AI는 쓸 때마다 돈이 나가.",choices:[{label:"가장 똑똑하고 비싼 AI를 쓴다",sk:"C",fx:{unitCost:700,trust:4,impact:12},text:"풀이가 정확하고 설명도 친절해. 대신 회원 한 명당 사용료가 700원 더 들어."},{label:"중간 정도의 AI를 쓴다",sk:"",fx:{impact:5},text:"대부분의 문제는 잘 풀어. 어려운 문제에서는 가끔 헤매."},{label:"가장 값싼 AI를 쓴다",sk:"",fx:{unitCost:-1e3,impact:-5,flag:"frozen"},text:"사용료가 크게 줄었어. 그런데 시험 삼아 물어본 수학 문제에서 틀린 답이 몇 번 나왔어."}]},{title:"한 달 이용료, 얼마 받을까",text:"앱을 내놓기 직전이야. 회원 한 명에게 드는 AI 사용료를 보고 한 달 이용료를 정해야 해. 학생 용돈으로 낼 수 있는 값은 얼마일까?",concept:"구독 — 한 번 팔고 끝나는 게 아니라 달마다 돈을 받는 방식이야. 다음 달에도 쓰고 싶어야 회원이 남아.",choices:[{label:"7,900원 — 하루 질문 수를 정해 두고 싸게 한다",sk:"",fx:{priceSet:7900,unitCost:-500,trust:3},text:'"이 정도면 용돈으로도 낸다"는 반응이야. 질문 수를 정해 둬서 AI 사용료도 줄었어. 한 명당 남는 돈이 적어서 회원이 많아야 해.'},{label:"9,900원 — 비슷한 공부 앱과 같은 값으로 한다",sk:"",fx:{priceSet:9900},text:"무난한 값이야. 값으로는 눈에 띄지 않으니 쓸모로 골라지게 해야 해."},{label:"12,900원 — 일대일 맞춤 기능을 넣고 비싸게 받는다",sk:"I",fx:{priceSet:12900,unitCost:500,trust:2},text:"학원 한 번 값보다는 싸다며 부모님들이 관심을 보여. 회원은 적어도 한 명당 남는 돈이 커."}]},{title:"어디에서 알릴까",text:'앱 장터 담당자가 연락했어. "추천 앱 자리에 올려 드릴게요. 대신 장터에서 결제될 때마다 수수료를 내셔야 해요."',concept:"플랫폼 수수료 — 남의 장터에서 팔면 손님을 쉽게 만나지만 팔 때마다 떼이는 돈이 있어. 매출과 이익은 달라.",choices:[{label:"앱 장터 추천 자리에 올린다 (수수료 20%)",sk:"C",fx:{deliveryShare:.8,feeRate:.2,demand:1.3},text:"내려받는 사람이 쉴 새 없이 늘어. 장터에서 결제될 때마다 5분의 1이 수수료로 나가."},{label:"학교와 독서실에 알리고 단체로 가입받는다 (수수료 12%)",sk:"P",fx:{deliveryShare:.5,feeRate:.12,demand:1.12},text:"선생님과 독서실 사장님이 소개해 줘서 믿고 가입하는 학생이 꾸준히 늘어."},{label:"우리 누리집에서만 가입받는다",sk:"I",fx:{cash:-30,deliveryShare:0,feeRate:0,demand:.95,trust:3},text:"수수료는 0원. 써 본 친구가 다른 친구를 데려와. 새 회원은 더디게 늘어."}]},{title:'"출시가 코앞인데 집에 가도 돼요?"',text:'새 기능을 내놓기로 한 날이 일주일 남았어. 개발자 서준이 조심스럽게 물어. "이번 주도 밤새워야 하나요? 벌써 3주째예요."',concept:"지치지 않는 속도 — 밤샘으로 당긴 시간은 실수와 퇴사로 돌아오기 쉬워. 오래 달리려면 쉴 틈이 있어야 해.",choices:[{label:"출시일을 2주 미루고 제때 퇴근한다",sk:"T",fx:{team:12,temp:.93},text:"기다리던 회원 몇 명이 아쉬워했어. 서준은 푹 쉬고 와서 숨어 있던 오류를 잡아냈어."},{label:'"이번만 버티자"며 밤샘을 이어 간다',sk:"",fx:{team:-15,temp:1.06},text:"기능은 제날짜에 나왔어.",risk:{p:.6,bad:{fx:{trust:-6,cash:-50},text:"그런데 졸면서 짠 부분에서 오류가 터져, 하루 동안 앱이 열리지 않았어."},good:{text:"다들 말없이 책상에 엎드려 있어."}}},{label:"기능을 절반만 먼저 내고 나머지는 다음 달에 낸다",sk:"P",fx:{team:6,trust:2},text:'꼭 필요한 것만 추려서 내놓았어. "작게 내고 고쳐 가자"는 말이 팀의 입버릇이 됐어.'}]},{title:"AI가 틀린 답을 알려 줬다",idea:!0,text:'한 회원이 글을 올렸어. "앱이 알려 준 풀이대로 썼다가 수행평가에서 틀렸어요." 확인해 보니 AI가 그럴듯하게 틀린 답을 말한 거였어.',concept:"환각 — AI가 모르는 것을 아는 것처럼 지어내는 일이야. AI를 쓰는 회사는 AI의 실수까지 책임져야 해.",choices:[{label:"선생님들을 모셔 AI의 풀이를 검사한다",sk:"P",fx:{etc:20,trust:7,impact:12},text:"달마다 검사 비용이 들어. 자주 틀리던 단원이 눈에 띄게 줄었어."},{label:'답마다 "AI는 틀릴 수 있어요. 꼭 확인해 봐"라고 알린다',sk:"",fx:{trust:2,impact:3},text:"돈은 들지 않았어. 정직하다는 반응과, 그럼 왜 돈을 내느냐는 반응이 함께 나와."},{label:"그 회원에게만 환불해 주고 넘어간다",sk:"",fx:{cash:-5,trust:-3},text:"글은 내려갔어.",risk:{p:.5,bad:{fx:{trust:-10,temp:.9},text:"하지만 같은 일을 겪은 학생들이 줄줄이 후기를 남겼어."},good:{text:"이번에는 조용히 지나갔어."}}}]},{title:"숙제를 통째로 베끼는 회원들",text:'기록을 보니 문제 사진을 찍고 답만 받아 적는 회원이 많아. 한 선생님이 전화했어. "그 앱 때문에 아이들이 생각을 안 해요."',concept:"제품의 목적 — 손님이 원하는 것과 손님에게 좋은 것이 다를 때가 있어. 공부 앱은 무엇을 팔아야 할까?",choices:[{label:"답을 바로 주지 않고, 힌트를 주며 스스로 풀게 한다",sk:"I",fx:{demand:.94,impact:18,trust:3,flag:"eco"},text:'"답답하다"며 떠난 회원이 있어. 남은 회원들의 다음 시험 점수가 올랐어.'},{label:"답을 보기 전에 내 풀이를 먼저 적게 한다",sk:"P",fx:{demand:.98,impact:10,trust:2},text:"한 줄이라도 스스로 써 본 뒤에 답을 봐. 베끼기가 조금 줄었어."},{label:"회원이 원하는 대로 답을 바로 알려 준다",sk:"",fx:{demand:1.06,impact:-10},text:'쓰기 편하다며 회원이 늘었어. 몇몇 학교에서 "숙제할 때 쓰지 말라"는 말이 나왔어.'}]},{title:"학원 체인의 단체 계약",idea:!0,text:'교실이 스무 곳인 학원 체인에서 연락이 왔어. "우리 학원생 전체가 쓰게 할게요. 대신 이용료를 30% 깎아 주고, 우리 학원 문제만 나오게 바꿔 주세요."',concept:"큰 거래처 — 한 곳이 매출을 크게 올려 주면 든든하지만, 그 한 곳이 떠나면 회사가 흔들려.",choices:[{label:"조건을 모두 받아들인다",sk:"",fx:{temp:1.35,demand:1.05,team:-8,trust:-2},text:"회원 수가 크게 뛰었어. 팀원들은 학원이 바라는 대로 고치느라 우리 계획을 미뤘어."},{label:"값은 덜 깎고, 앱은 그대로 쓰는 조건으로 다시 협상한다",sk:"CP",fx:{team:3},text:"우리 조건을 정리해서 보냈어.",risk:{p:.4,fair:!0,bad:{fx:{temp:.97},text:"학원은 다른 앱을 알아보겠다고 했어. 그래도 할 말은 했어."},good:{fx:{temp:1.25,demand:1.04,trust:3},text:'며칠 뒤 "그렇게 합시다"라는 답이 왔어!'}}},{label:"거절하고 학생 한 명 한 명을 손님으로 삼는다",sk:"",fx:{trust:3,team:4},text:"큰돈은 놓쳤어. 누구 한 곳에 끌려다니지 않고 우리 계획대로 가."}]},{title:"공부 기록을 사겠다는 회사",text:'광고 회사가 제안했어. "회원들이 어떤 과목을 어려워하는지, 몇 시에 공부하는지 넘겨 주세요. 400만 원을 드릴게요."',concept:"개인정보 — 회원이 남긴 기록은 회원의 것이야. 회사는 잠시 맡아 둔 것일 뿐이야.",choices:[{label:"거절하고, 기록을 어디에도 넘기지 않겠다고 약속한다",sk:"C",fx:{trust:8,impact:14},text:"약속을 앱 첫 화면에 적었어. 부모님들이 안심하고 가입시켜."},{label:"이름을 지운 통계만 150만 원에 판다",sk:"",fx:{cash:150,trust:-3,impact:-4},text:'통장에 돈이 들어왔어. "이름을 지웠다지만 찜찜하다"는 글이 올라왔어.'},{label:"알리지 않고 기록을 통째로 넘긴다",sk:"",fx:{cash:400,impact:-12},text:"통장에 400만 원이 들어왔어.",risk:{p:.6,bad:{fx:{cash:-300,trust:-20},text:"그런데 회원들에게 학원 광고 전화가 쏟아지면서 들통났어. 과징금을 물고 탈퇴가 이어졌어."},good:{text:"아직 아무도 몰라. 약관을 읽는 사람이 없으니까."}}}]},{title:"더 오래 붙잡아 둘까",idea:!0,text:'투자 설명회에서 들었어. "앱은 오래 쓰게 만들수록 돈이 돼요. 연속 출석 불꽃, 밤늦은 알림, 친구 순위표를 넣으세요."',concept:"주의력 경제 — 사람의 시간과 눈길을 붙잡아 돈을 버는 방식이야. 오래 쓰는 것과 잘 쓰는 것은 달라.",choices:[{label:'오늘 공부를 마치면 "이제 쉬어"라고 알려 주는 앱으로 만든다',sk:"I",fx:{demand:.97,impact:16,trust:5,flag:"eco"},text:'쓰는 시간은 줄었어. "이 앱은 나를 붙잡지 않아서 좋다"는 후기가 달렸어.'},{label:"알림과 순위표를 넣되, 끄는 단추를 눈에 띄게 둔다",sk:"P",fx:{demand:1.04,impact:2},text:"경쟁을 좋아하는 회원은 켜고, 싫은 회원은 꺼. 고를 수 있게 했어."},{label:"불꽃, 밤 알림, 순위표를 모두 넣는다",sk:"",fx:{demand:1.12,impact:-14,team:-3},text:'쓰는 시간이 크게 늘었어. "불꽃이 꺼질까 봐 새벽에도 켠다"는 후기를 보고 팀원들 표정이 굳었어.'}]},{title:'"성적이 무조건 오릅니다"',text:`광고 문구를 정해야 해. 홍보 담당 유나가 물어. "한 달 만에 20점 오른 회원이 있어요. 그 한 명을 앞세워서 '누구나 20점 오른다'고 쓸까요?"`,concept:"과장 광고 — 드문 사례를 모두의 결과처럼 말하면 거짓이 돼. 기대를 부풀린 만큼 실망도 커져.",choices:[{label:"회원 전체의 평균 변화를 있는 그대로 싣는다",sk:"C",fx:{trust:7,impact:10},text:'"평균 4점 올랐어요." 숫자는 수수해도 믿을 만하다는 말을 들어.'},{label:"숫자 대신 회원들이 쓴 후기를 모아 보여 준다",sk:"I",fx:{trust:4,demand:1.03},text:"잘된 이야기와 아쉬운 이야기를 함께 실었어. 읽고 가입하는 학생이 늘었어."},{label:'"누구나 20점 오른다"고 크게 쓴다',sk:"",fx:{temp:1.2,impact:-6},text:"광고를 보고 가입이 몰렸어.",risk:{p:.6,bad:{fx:{cash:-150,trust:-14},text:'한 달 뒤 "안 오르던데요" 하는 환불 요청과 신고가 쏟아졌어.'},good:{text:"아직은 항의가 없어. 다음 시험이 끝나면 어떨지 몰라."}}}]},{title:"시험 기간에 앱이 멈췄다",text:"기말고사 전날 밤, 회원이 한꺼번에 몰려서 앱이 느려지다가 멈췄어. 문의 글이 수백 개 쌓였고 팀원들은 새벽까지 매달려 있어.",concept:"몰릴 때를 대비하기 — 가장 필요할 때 멈추면 평소에 쌓은 믿음이 한 번에 무너져. 여유는 낭비가 아니야.",choices:[{label:"서버를 넉넉하게 늘린다",sk:"G",fx:{etc:25,trust:6,team:4},text:"달마다 서버비가 더 들어. 다음 시험 기간에는 한 번도 멈추지 않았어."},{label:"몰릴 때만 서버가 저절로 늘어나게 고친다",sk:"PI",fx:{cash:-120,etc:8,trust:5,team:6},text:"고치는 데 돈과 시간이 들었어. 평소에는 아끼고 시험 기간에는 버텨."},{label:"시험 기간만 팀원들이 밤새 지켜본다",sk:"",fx:{team:-12,trust:-3},text:"돈은 들지 않았어. 팀원들은 시험 기간이 다가올 때마다 한숨을 쉬어."}]},{title:"내년에는 어떤 회사가 될까",text:"열두 달이 지나가. 통장과 회원 수, 팀원들의 얼굴을 보면서 내년 계획을 세워야 해.",concept:"사명 — 회사가 왜 있는지를 한 문장으로 말할 수 있어야 해. 그 문장이 어려운 결정의 기준이 돼.",choices:[{label:"학원에 다니기 어려운 학생에게 무료 이용권을 나눈다",sk:"T",fx:{cash:-150,impact:15,trust:6,team:5},text:'지역 아동 센터 세 곳과 손잡았어. 팀원들이 "이 일을 하길 잘했다"고 말해.'},{label:"영어와 과학까지 과목을 넓힌다",sk:"G",fx:{cash:-200,demand:1.12,team:-3},text:"새 과목을 만드느라 바빴어. 연말에 새 회원이 늘었어."},{label:"지금 있는 기능을 다듬고 돈을 모아 둔다",sk:"",fx:{trust:3,team:2},text:"새로 벌인 일은 없어. 자잘한 불편을 고치면서 한 해를 차분하게 마무리했어."}]}],Xm={4:{title:'"집에서 일해도 될까요?"',text:'디자이너 나은이 말을 꺼냈어. "회사까지 왕복 세 시간이에요. 일주일에 사흘은 집에서 일하면 안 될까요?"',concept:"일하는 방식 — 어디서 일하느냐보다 무엇을 해내느냐가 중요해. 다만 떨어져 일하려면 약속과 믿음이 더 필요해.",choices:[{label:"모두에게 집에서 일할 수 있는 날을 준다",sk:"T",fx:{team:12,etc:5},text:"화상 회의 도구를 샀어. 길에서 버리던 시간이 줄자 팀원들 얼굴이 밝아졌어."},{label:'"다 같이 모여야 일이 된다"며 거절한다',sk:"",fx:{team:-10},text:"나은은 알겠다고 했어. 그 뒤로 퇴근 시간이 되면 가장 먼저 일어나."},{label:"한 달만 해 보고, 결과를 보며 함께 정한다",sk:"P",fx:{team:7},text:"해 보니 회의는 모여서, 집중할 일은 집에서 하는 게 좋았어. 규칙을 함께 정했어."}]},5:{title:"돈을 낸 회원만 좋은 AI?",idea:!0,text:'회원이 늘면서 AI 사용료가 무거워졌어. 서준이 말해. "무료로 써 보는 사람에게는 값싼 AI를, 돈 낸 회원에게만 좋은 AI를 붙이면 어때요?"',concept:"무료와 유료 — 공짜로 써 보게 하면 손님이 늘지만 그 비용은 누군가 내야 해. 어디까지 공짜로 줄지가 사업의 모양을 정해.",choices:[{label:"무료 체험은 하루 세 문제로 줄이고, AI는 똑같이 좋은 것을 쓴다",sk:"P",fx:{unitCost:-200,trust:3,impact:4},text:"써 본 사람은 제대로 된 실력을 봤어. 사용료도 조금 줄었어."},{label:"무료 체험에는 값싼 AI를 붙인다",sk:"",fx:{unitCost:-500,trust:-5},text:'사용료가 줄었어. 써 본 사람들이 "틀린 답이 많네" 하고 떠나.'},{label:"무료 체험을 없애고 첫 달을 절반 값으로 한다",sk:"C",fx:{unitCost:-400,demand:.95},text:"구경만 하던 사람이 빠져서 사용료가 줄었어. 새로 들어오는 회원도 조금 줄었어."}]},6:{title:"문제집을 통째로 넣어 달래",text:'회원들이 졸라. "유명한 문제집 풀이를 앱에서 바로 보게 해 주세요." 서준이 말해. "문제집을 스캔해서 AI에 넣으면 금방 돼요."',concept:"저작권 — 남이 만든 문제와 풀이에도 주인이 있어. 허락 없이 쓰면 돈도 믿음도 잃어.",choices:[{label:"출판사에 사용료를 내고 정식으로 넣는다",sk:"P",fx:{etc:30,demand:1.08,trust:4},text:'달마다 사용료가 나가. 표지에 "공식 제휴"라고 떳떳하게 적었어.'},{label:"허락 없이 스캔해서 넣는다",sk:"",fx:{demand:1.1},text:"회원들이 좋아해.",risk:{p:.65,bad:{fx:{cash:-250,trust:-10,demand:.92},text:"두 달 뒤 출판사에서 경고장이 왔어. 풀이를 모두 내리고 합의금을 물었어."},good:{text:"아직 출판사는 모르는 것 같아."}}},{label:"선생님들과 우리만의 문제를 새로 만든다",sk:"I",fx:{cash:-100,demand:1.04,impact:6,team:4},text:'시간이 걸렸어. "여기 문제가 더 좋다"는 말이 조금씩 들려.'}]},7:{title:"큰 회사가 공짜 앱을 냈다",idea:!0,text:"누구나 아는 큰 회사가 비슷한 AI 공부 앱을 공짜로 내놓았어. 회원 탈퇴 알림이 평소보다 많이 울려.",concept:'경쟁과 차별화 — 값으로는 큰 회사를 이길 수 없어. 작은 회사는 "여기여야 하는 까닭"으로 살아남아.',choices:[{label:"이용료를 1,000원 내린다",sk:"",fx:{price:-1e3,trust:2},text:"떠나려던 회원 몇 명이 남았어. 한 명당 남는 돈이 줄었어."},{label:"중학교 수학 한 과목에 집중해서 가장 잘 가르치는 앱이 된다",sk:"I",fx:{demand:.96,trust:6,impact:6},text:'다른 과목을 찾던 회원은 떠났어. "중학 수학은 여기"라는 말이 퍼지기 시작했어.'},{label:"회원 모임을 열어 무엇이 아쉬운지 듣고 고친다",sk:"PT",fx:{cash:-40,trust:5,team:4,temp:.96},text:'큰 회사 앱에는 없는 "오답 다시 풀기"를 만들어 달라는 말이 가장 많았어. 다음 달에 바로 넣었어.'}]},8:{title:"투자자가 찾아왔다",text:'투자 회사에서 왔어. "1,000만 원을 넣겠습니다. 대신 3년 안에 회원을 열 배로 늘려야 하고, 앱에 광고를 붙이세요."',concept:"투자 — 남의 돈으로 빨리 클 수 있지만, 돈을 낸 사람의 뜻도 함께 들어와. 누구의 회사인지가 달라져.",choices:[{label:"투자를 받고 조건을 따른다",sk:"C",fx:{cash:1e3,demand:1.06,impact:-10,team:-5},text:"통장이 넉넉해졌어. 문제를 푸는 화면 아래에 게임 광고가 붙었어."},{label:'"광고 없이"를 조건으로 다시 이야기한다',sk:"P",fx:{},text:"우리 생각을 설명했어.",risk:{p:.5,fair:!0,bad:{fx:{team:3},text:'투자자는 고개를 저으며 돌아갔어. 팀원들은 "잘했어요"라고 말해.'},good:{fx:{cash:600,trust:3,team:4},text:'투자자가 "그 고집이 마음에 든다"며 600만 원을 넣었어!'}}},{label:"거절하고 번 돈으로 천천히 큰다",sk:"",fx:{team:4,trust:2},text:"빨리 크지는 못해. 무엇을 만들지는 계속 우리가 정해."}]},9:{title:"AI의 말투가 이상하다",idea:!0,text:'한 회원의 어머니가 화면을 찍어 보냈어. AI가 "이것도 모르면 큰일인데"라고 답했고, 여학생에게는 문과를, 남학생에게는 이과를 권했대.',concept:"AI의 편견 — AI는 배운 글 속의 치우친 생각까지 따라 해. 만든 회사가 살펴보고 바로잡아야 해.",choices:[{label:"AI의 답을 꼼꼼히 살펴보고 말투와 진로 조언을 고친다",sk:"P",fx:{cash:-80,trust:6,impact:10},text:'수백 개의 답을 하나씩 읽었어. 고친 내용을 공지에 올리자 "믿고 맡긴다"는 답글이 달렸어.'},{label:"진로 이야기는 AI가 답하지 않게 막는다",sk:"",fx:{trust:2,impact:3},text:"급한 불은 껐어. 말투 문제는 그대로 남아 있어."},{label:'"AI가 한 말이라 어쩔 수 없다"고 답한다',sk:"",fx:{trust:-6,impact:-8},text:"어머니는 그 답을 학부모 모임 방에 올렸어."}]},10:{title:"시범 학교 신청서",text:'교육청에서 AI 공부 앱 시범 학교 사업을 열었어. 뽑히면 500만 원을 받아. 신청서에 "지금 쓰는 학교 수"를 적는 칸이 있는데, 우리는 두 곳뿐이야.',concept:"지원금과 정직 — 나라의 돈은 모두의 돈이야. 부풀려서 받으면 정말 필요한 곳의 몫이 줄어.",choices:[{label:"있는 그대로 두 곳이라고 적고, 선생님들의 추천 글을 붙인다",sk:"P",fx:{},text:"정직하게 써서 냈어.",risk:{p:.5,fair:!0,bad:{fx:{trust:2},text:'이번에는 떨어졌어. 심사평에 "내용이 믿을 만함"이라고 적혀 있었어.'},good:{fx:{cash:500,trust:4,impact:5},text:"뽑혔어! 작아도 믿을 만하다는 평가를 받았어."}}},{label:"이야기만 오간 학교까지 넣어 열 곳이라고 적는다",sk:"",fx:{},text:"숫자를 고쳐서 냈어.",risk:{p:.6,bad:{fx:{cash:-100,trust:-12},text:"확인 전화에서 들통났어. 탈락은 물론이고 3년 동안 신청도 못 하게 됐어."},good:{fx:{cash:500,impact:-6},text:"500만 원을 받았어. 서류를 넘길 때마다 손이 떨려."}}},{label:"올해는 건너뛰고, 쓰는 학교를 늘려서 내년에 낸다",sk:"G",fx:{trust:2,team:2},text:"지원금은 없어. 그 시간에 학교 세 곳을 더 찾아갔어."}]},11:{title:"이용료를 못 내는 회원",text:'상담 담당 유나가 글 하나를 보여 줘. "아빠가 일을 쉬게 돼서 이번 달부터 못 낼 것 같아요. 수능이 얼마 안 남았는데 계속 쓸 방법이 없을까요?"',concept:"뜻과 살림 — 돕고 싶은 마음과 회사를 지키는 일이 부딪힐 때가 있어. 한 사람을 돕는 방법과 오래 돕는 방법을 함께 생각해 봐.",choices:[{label:"형편이 어려운 회원은 무료로 쓰는 제도를 만든다",sk:"T",fx:{etc:20,impact:14,trust:5,team:5},text:"달마다 비용이 들어. 신청 방법은 남들 눈에 띄지 않게 만들었어."},{label:'회원들이 "한 달 선물하기"로 서로 도울 수 있게 한다',sk:"I",fx:{cash:-40,impact:10,trust:4},text:"졸업한 회원들이 후배에게 한 달씩 선물했어. 회사 혼자 지지 않아도 됐어."},{label:'"규정이라 어렵다"고 답한다',sk:"",fx:{team:-5,impact:-5},text:"유나는 그 답을 보내고 한참 화면을 바라봤어."}]},12:{title:"큰 회사가 사겠대",text:'큰 교육 회사에서 제안이 왔어. "앱을 우리에게 넘기세요. 값은 넉넉히 드리고 팀원들도 모두 데려갈게요. 이름과 방향은 우리가 정합니다."',concept:"회사를 넘기는 일 — 회사를 파는 것도 하나의 마무리야. 무엇을 얻고 무엇을 내려놓는지 따져 봐야 해.",choices:[{label:"넘기지 않고 우리 이름으로 계속한다",sk:"C",fx:{team:6,trust:3},text:'큰돈은 놓쳤어. 팀원들은 "우리가 시작한 걸 우리가 끝까지 해 보자"고 말해.'},{label:"넘기지 않고, 그 회사 학습지에 우리 앱을 넣는 제휴를 제안한다",sk:"PI",fx:{team:2},text:"다른 길을 제안했어.",risk:{p:.45,fair:!0,bad:{fx:{},text:'"사는 게 아니면 관심 없다"는 답이 왔어.'},good:{fx:{temp:1.3,demand:1.05,trust:3},text:'"그것도 좋겠네요." 학습지 뒷면에 우리 앱 이름이 실렸어!'}}},{label:"절반을 넘기고 돈을 받는다",sk:"",fx:{cash:700,impact:-8,team:-6},text:"통장이 두둑해졌어. 다음 달 회의부터 그 회사 사람이 가운데 자리에 앉아."}]}},Zm=[{key:"S-team",month:7,when:n=>n.team<=40,card:{title:"팀원들이 떠나겠대",text:'서준과 나은이 함께 찾아왔어. "대표님, 저희 이번 달까지만 할게요." 밤샘과 급한 수정이 쌓이고 쌓였나 봐.',concept:"이직의 비용 — 사람이 나가면 새로 뽑고 가르치는 데 돈과 시간이 들어. 붙잡는 값과 떠나보내는 값을 견줘 봐.",choices:[{label:"사과하고 월급을 올려 붙잡는다",sk:"T",fx:{wage:15,team:18},text:"둘은 남기로 했어. 인건비가 올랐지만 앱은 멈추지 않았어."},{label:"보내 주고 새 사람을 뽑는다",sk:"",fx:{cash:-60,team:8,temp:.88},text:"새 팀원이 앱 구조를 익힐 때까지 오류 수정이 밀렸어."},{label:"한 사람씩 이야기를 듣고, 바꿀 점을 함께 찾는다",sk:"TP",fx:{team:14,temp:.95},text:"출시 날짜를 누가 정하는지, 쉬는 날을 지키는지. 듣고 보니 돈보다 먼저 고칠 게 있었어. 둘은 한 달 더 지켜보기로 했어."}]}},{key:"S-cheap",month:8,when:n=>!!n.flags.frozen,card:{title:'"이 앱, 답이 엉터리예요"',text:'구독자가 많은 공부 유튜버가 우리 앱에 문제 백 개를 물어본 영상을 올렸어. "서른 개나 틀린다"는 제목이야.',concept:"품질과 평판 — 값을 아끼려고 낮춘 품질은 언젠가 드러나. 믿음을 되찾는 데는 잃을 때보다 훨씬 오래 걸려.",choices:[{label:"사과하고 어떤 AI를 쓰는지, 얼마나 틀리는지 공개한다",sk:"P",fx:{trust:-3},text:'실망한 회원도 있었어. 그래도 "숨기지 않아서 다시 본다"는 댓글이 달렸어.'},{label:"더 똑똑한 AI로 바꾼다",sk:"P",fx:{unitCost:900,trust:5,impact:8,unflag:"frozen"},text:'사용료가 다시 올랐어. 그 유튜버가 "바뀌었네요" 하고 다음 영상에서 소개했어.'},{label:"대응하지 않고 잠잠해지기를 기다린다",sk:"",fx:{},text:"아무 글도 올리지 않았어.",risk:{p:.7,bad:{fx:{cash:-200,trust:-18},text:"영상이 학부모 모임 방마다 퍼지면서 환불 요청이 쏟아졌어."},good:{text:"며칠 뒤 다른 화제에 묻혔어. 이번에는."}}}]}},{key:"S-good",month:10,when:n=>n.impact>=45,card:{title:"선생님들이 수업에 쓰고 싶대",text:'한 중학교 수학 선생님이 연락했어. "베끼지 못하게 만든 앱이라 수업에 쓰고 싶어요. 다른 학교 선생님들에게도 소개해도 될까요?"',concept:"평판의 힘 — 좋은 일은 알려지면 사업에도 도움이 돼. 다만 알리려고 하는 일과 하다 보니 알려진 일은 달라.",choices:[{label:"선생님 연수에 가서 직접 소개한다",sk:"",fx:{temp:1.25,trust:5},text:"연수가 끝난 주에 학교 단체 가입이 평소의 몇 배로 몰렸어."},{label:"선생님들과 함께 수업용 기능을 만든다",sk:"T",fx:{temp:1.15,trust:5,team:8},text:'서준과 나은이 교실에 가서 수업을 지켜봤어. 선생님들 이름이 "함께 만든 사람"에 올랐어.'},{label:"아직 모자라다며 정중히 미룬다",sk:"",fx:{trust:1,impact:3},text:"소개는 다음으로 미뤘어. 하던 일을 하던 대로 계속했어."}]}}],Km=Object.freeze(Object.defineProperty({__proto__:null,ALT:Xm,CARDS:Ym,FOLLOW:Zm},Symbol.toStringTag,{value:"Module"})),ji={chicken:{id:"chicken",icon:"🍗",short:"치킨집",kind:"동네 가게",boss
